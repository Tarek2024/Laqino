name: Marketplace ad management review
on:
  push:
    branches: [development, fix/market-ui-phase1-2-20261110, feature/marketplace-ad-management, phase90-fcm-native-fix, review/integrated-client-ui-account-orders-20261111]
  pull_request:
    branches: [main]
jobs:
  marketplace-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install marketplace regression dependencies
        run: |
          python -m pip install cryptography Pillow playwright
          python -m playwright install chromium
      - name: Compile changed Python files
        run: python -m py_compile server.py notif.py fcm.py product_orders.py shop_delivery.py test_phase90_fcm.py test_phase69_shop_delivery.py test_phase87_product_orders.py test_phase95_account_orders_archive.py test_phase96_delivery_unchanged.py test_phase_marketplace_ad_management.py chat.py test_phase4_chat.py test_registration_account_recovery.py test_phase91_market_ui.py
      - name: Validate release and service-worker cache version
        run: python check_versions.py
      - name: Run full release readiness checks
        run: python release_check.py
      - name: Run chat privacy and compatibility regression tests (early gate)
        run: python test_phase4_chat.py
      - name: Run registration recovery and account activation regression tests
        run: python test_registration_account_recovery.py
      - name: Run Phase 91 focused UI and marketplace share regression tests
        run: python test_phase91_market_ui.py
      - name: Run Phase 95 account order archive UI regression
        run: python test_phase95_account_orders_archive.py
      - name: Run Phase 96 delivery page and lifecycle unchanged regression
        run: python test_phase96_delivery_unchanged.py
      - name: Run isolated marketplace regression tests
        run: python test_phase_marketplace_ad_management.py
      - name: Run existing marketplace favorites and reports regression tests
        run: python test_phase8b_listing_social.py
      - name: Run Phase 90 FCM payload and destination regression tests
        run: python test_phase90_fcm.py
      - name: Run shop-order native push integration regression
        run: python test_phase69_shop_delivery.py
      - name: Run pharmacy product-order push integration regression
        run: python test_phase87_product_orders.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check native notification bridge and permission helper
        run: |
          node --check static/native.js
          node --check static/perm.js
      - name: Syntax-check inline page scripts
        run: |
          python - <<'PY'
          import pathlib, re
          files = [pathlib.Path('static/index.html'), pathlib.Path('static/market.html')]
          out = pathlib.Path('/tmp/laqino-inline-js')
          out.mkdir(exist_ok=True)
          n = 0
          for page in files:
              source = page.read_text(encoding='utf-8')
              for script in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', source, re.I):
                  if not script.strip():
                      continue
                  target = out / f'check-{n}.js'
                  target.write_text(script, encoding='utf-8')
                  n += 1
          print(f'Extracted {n} inline scripts')
          PY
          for f in /tmp/laqino-inline-js/*.js; do node --check "$f"; done

  full-project-regression:
    name: Full project regression suite (diagnostic, non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install full-project test dependencies
        run: |
          python -m pip install cryptography openpyxl Pillow playwright
          python -m playwright install chromium
      - name: Compile all project Python modules and test scripts
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files = sorted(pathlib.Path('.').glob('*.py'))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files")
          PY
      - name: Run all existing Python test scripts in isolation
        shell: bash
        run: |
          set +e
          total=0
          failed=0
          skipped=0
          : > /tmp/laqino-test-failures.txt
          for f in test_*.py; do
            [ -f "$f" ] || continue
            total=$((total+1))
            echo "::group::TEST $f"
            timeout 180s python "$f"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              failed=$((failed+1))
              printf '%s (exit %s)\n' "$f" "$rc" | tee -a /tmp/laqino-test-failures.txt
            fi
          done
          echo "TOTAL=$total FAILED=$failed"
          if [ "$failed" -ne 0 ]; then
            cat /tmp/laqino-test-failures.txt
            exit 1
          fi
      - name: Syntax-check all inline scripts in static HTML pages
        if: always()
        run: |
          python - <<'PY'
          import pathlib, re
          out = pathlib.Path('/tmp/laqino-inline-js')
          out.mkdir(exist_ok=True)
          n = 0
          for page in pathlib.Path('static').glob('*.html'):
              source = page.read_text(encoding='utf-8')
              for script in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', source, re.I):
                  if not script.strip():
                      continue
                  target = out / f'check-{n}.js'
                  target.write_text(script, encoding='utf-8')
                  n += 1
          print(f'Extracted {n} inline scripts from static HTML')
          PY
          for f in /tmp/laqino-inline-js/*.js; do node --check "$f"; done

  baseline-main-regression:
    name: Baseline regression suite (main, diagnostic, non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install full-project test dependencies
        run: |
          python -m pip install cryptography openpyxl Pillow playwright
          python -m playwright install chromium
      - name: Compile baseline Python modules and test scripts
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files = sorted(pathlib.Path('.').glob('*.py'))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files on main")
          PY
      - name: Run all baseline Python test scripts in isolation
        shell: bash
        run: |
          set +e
          total=0
          failed=0
          : > /tmp/laqino-main-test-failures.txt
          for f in test_*.py; do
            [ -f "$f" ] || continue
            total=$((total+1))
            echo "::group::BASELINE TEST $f"
            timeout 180s python "$f"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              failed=$((failed+1))
              printf '%s (exit %s)\\n' "$f" "$rc" | tee -a /tmp/laqino-main-test-failures.txt
            fi
          done
          echo "BASELINE_TOTAL=$total BASELINE_FAILED=$failed"
          if [ "$failed" -ne 0 ]; then
            cat /tmp/laqino-main-test-failures.txt
            exit 1
          fi


  shop-image-regression:
    name: Shop image loading and identity regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shop image browser-test dependencies
        run: |
          python -m pip install cryptography Pillow playwright
          python -m playwright install chromium
      - name: Compile shop image regression tests
        run: python -m py_compile test_phase68_shop_panel.py test_phase82_shop_images.py test_phase83_shop_identity.py
      - name: Test shop dashboard image lazy loading
        run: python test_phase68_shop_panel.py
      - name: Test public shop image loading and privacy
        run: python test_phase82_shop_images.py
      - name: Test shop logo and cover identity
        run: python test_phase83_shop_identity.py
