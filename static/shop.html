<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f2a5c"><link rel="icon" href="/assets/icon-192.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="robots" content="noindex, nofollow">
<title>لاقينو — لوحة المحل</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/panel.css"><link rel="stylesheet" href="/pdelivery.css"></head><body class="panel shop">
<header class="ph"><div class="in"><a class="back" href="/" aria-label="رجوع للتطبيق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>رجوع للتطبيق</span></a><div class="tt"><img class="lg" src="/assets/logo.jpg" alt=""><h1>لوحة المحل</h1></div><div class="ph-end" id="ph-end"></div></div></header><main id="m"></main><div class="tb" id="tb" role="tablist" aria-label="أقسام اللوحة"></div><script src="/notif.js" defer></script><script>
/* المرحلة 68 (م3 المحلات): لوحة المحل. المرحلة 69 (م4): تبويب «الطلبات» = زر «اطلب مندوب» (نفس بطاقة الصيدلية) + طلبات العملاء من المحل. الصلاحية = وجود محل معتمد للمالك؛ كل النصوص القادمة من الخادم تمر عبر esc. */
const T=localStorage.getItem('t'),R=+localStorage.getItem('rg')||0,m=document.getElementById('m'),$=i=>document.getElementById(i);
let DLB=0,DLK='',TYP='',TXF={dlp:'',dlm:'',dln:''},msg='',isErr=0,TAB=({m:1,i:1,o:1})[location.hash.slice(1)]?location.hash.slice(1):'m',SEL=+localStorage.getItem('shsel')||0,SAVED=null,BUSY=0;const EIMG={},OPEN={};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,b)=>{const r=await fetch('/api'+p,{method:b===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw j.error;return j};
const KEEP=['in','ip','id','an','aa','ap','at','ar','dla'];const snap=()=>{SAVED={};KEEP.forEach(k=>{const e=$(k);if(e)SAVED[k]=e.value})};const restore=()=>{if(!SAVED)return;KEEP.forEach(k=>{const e=$(k);if(e&&SAVED[k]!=null)e.value=SAVED[k]});SAVED=null};
const run=f=>async(...a)=>{if(BUSY)return;BUSY=1;msg='';isErr=0;snap();try{await f(...a);SAVED=null}catch(e){msg=e&&e.message?e.message:e;isErr=1}BUSY=0;await load();restore()};
const ST={pending:'قيد المراجعة',approved:'معتمد',rejected:'مرفوض',suspended:'موقوف'};
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=()=>no('تعذّرت قراءة الملف');r.readAsDataURL(f)});
async function upl(files,max){const fs=[...(files||[])];if(fs.length>max)throw 'الحد الأقصى '+max+' صور للصنف';const ids=[];try{for(const f of fs){if(f.size>4e6)throw 'الصورة كبيرة (الحد 4 ميجابايت)';ids.push((await api('/files',{data:await b64(f)})).id)}}catch(e){await drop(ids);throw e}return ids}
async function drop(ids){for(const i of ids){try{await api('/files/'+i+'/delete',{})}catch(e){}}}  /* تنظيف أفضل جهد لصور رُفعت ثم فشل الحفظ (تُحسب في سقف الملفات) */
async function img(id,el){try{const r=await fetch('/api/files/'+id,{headers:{Authorization:'Bearer '+T}});if(r.ok)el.src=URL.createObjectURL(await r.blob())}catch(e){}}
const IC={m:'<path d="M4 10l1-5h14l1 5M5 10v9h14v-9M9 19v-5h6v5"/>',i:'<path d="M5 7h14M5 12h14M5 17h9"/>',o:'<path d="M6 7h12l-1 11H7L6 7zM9 7a3 3 0 016 0"/>'};
const tabs=(n,no)=>[['m','المحل',0],['i','الأصناف',n],['o','الطلبات',no]].map(([k,l,c])=>`<button role="tab" data-tab="${k}" class="${TAB==k?'on':''}" aria-selected="${TAB==k}" onclick="stab('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg><span>${l}</span>${c?`<i class="bd">${c}</i>`:''}</button>`).join('');
window.stab=k=>{TAB=k;if(k=='o')poll();try{history.replaceState(null,'','#'+k)}catch(e){}document.querySelectorAll('.tp').forEach(s=>s.classList.toggle('on',s.dataset.t==k));document.querySelectorAll('#tb button').forEach(b=>{const o=b.dataset.tab==k;b.classList.toggle('on',o);b.setAttribute('aria-selected',o)});scrollTo(0,0)};
const sec=(k,h)=>`<section class="tp${TAB==k?' on':''}" data-t="${k}">${h}</section>`;
window.shpick=v=>{SEL=+v;localStorage.setItem('shsel',SEL);load()};
window.shtog=run(async(id,open)=>{await api('/owner/shops/'+id+'/'+(open?'open':'close'),{});msg=open?'تم فتح المحل — يظهر مفتوحًا للعملاء':'تم غلق المحل'});
const itemForm=(mx,req)=>`<details class="card acc" id="dia" ${OPEN.dia?'open':''} ontoggle="OPEN.dia=this.open"><summary>＋ إضافة صنف جديد</summary><div class="acb"><input id="in" maxlength="80" placeholder="اسم الصنف"><div class="g2"><input id="ip" type="number" min="0" step="0.01" inputmode="decimal" placeholder="السعر (جنيه)"></div><textarea id="id" maxlength="500" placeholder="وصف (اختياري)"></textarea><label><small>صور الصنف (حتى ${mx}، JPG/PNG)${req?' — إجبارية لهذا النوع':''}</small><input id="if" type="file" accept="image/jpeg,image/png" multiple></label><button onclick="iadd()">إضافة الصنف</button></div></details>`;
window.iadd=run(async()=>{const mx=+(($('if').dataset||{}).mx)||5;const ids=await upl($('if').files,mx);try{await api('/owner/shops/'+SEL+'/items',{name_ar:$('in').value,price:$('ip').value,description:$('id').value,image_ids:ids})}catch(e){await drop(ids);throw e}OPEN.dia=0;msg='تمت إضافة الصنف.';SAVED=null;['in','ip','id'].forEach(k=>{const e=$(k);if(e)e.value=''})});
window.iav=run(async(id,v)=>{await api('/owner/shops/'+SEL+'/items/'+id+'/edit',{is_available:!!v})});
window.idl=run(async id=>{if(!confirm('حذف هذا الصنف؟'))return;const r=await api('/owner/shops/'+SEL+'/items/'+id+'/delete',{});await drop(r.freed_image_ids||[]);msg='تم حذف الصنف.'});
window.irm=(id,f,btn)=>{EIMG[id]=(EIMG[id]||[]).filter(x=>x!=f);btn.parentNode.remove()};
window.isv=run(async(id,mx)=>{const keep=[...(EIMG[id]||[])];const add=await upl($('ef'+id).files,Math.max(0,mx-keep.length));try{await api('/owner/shops/'+SEL+'/items/'+id+'/edit',{name_ar:$('en'+id).value,price:$('ep'+id).value,description:$('ed'+id).value,image_ids:keep.concat(add)})}catch(e){await drop(add);throw e}OPEN['e'+id]=0;msg='تم حفظ الصنف.'});
const itemCard=(x,mx)=>{EIMG[x.id]=EIMG[x.id]||x.image_ids.slice();return `<div class="card" id="it${x.id}">${x.image_ids.map(f=>`<img alt="" data-im="${+f}" style="height:70px;border-radius:10px;margin:0 0 6px 6px">`).join('')}<br><b>${esc(x.name_ar)}</b> <small>${x.is_available?'متاح':'<span class="e">غير متاح</span>'}</small><br>${esc(x.price)} ج${x.description?`<br><small>${esc(x.description)}</small>`:''}<div class="row"><button class="line" onclick="iav(${x.id},${x.is_available?0:1})">${x.is_available?'غير متاح':'متاح'}</button><button class="r" onclick="idl(${x.id})">حذف</button></div><details class="hint" ${OPEN['e'+x.id]?'open':''} ontoggle="OPEN['e'+${x.id}]=this.open"><summary>تعديل</summary><input id="en${x.id}" maxlength="80" value="${esc(x.name_ar)}" aria-label="اسم الصنف"><input id="ep${x.id}" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(x.price)}" aria-label="السعر"><textarea id="ed${x.id}" maxlength="500" aria-label="الوصف">${esc(x.description)}</textarea><div>${x.image_ids.map(f=>`<span style="display:inline-block;position:relative;margin:0 0 6px 6px"><img alt="" data-im="${+f}" style="height:56px;border-radius:8px"><button type="button" class="r" aria-label="إزالة الصورة" onclick="irm(${x.id},${+f},this)" style="position:absolute;top:-6px;left:-6px;padding:0 6px;min-height:0">✕</button></span>`).join('')}</div><label><small>إضافة صور (المجموع حتى ${mx})</small><input id="ef${x.id}" type="file" accept="image/jpeg,image/png" multiple></label><button onclick="isv(${x.id},${mx})">حفظ التعديل</button></details></div>`};
/* ---- م4: الدليفري. المحل يطلب مندوب (يستلم الأوردر منه ويوصله للعميل؛ نفس الصيدلية) + طلبات العملاء من المحل (المندوب يوصلها مباشرة). كل نص من الخادم يمر عبر esc. ---- */
const DLS={searching:'بانتظار مندوب',assigned:'تم قبول الطلب',heading_pickup:'المندوب في الطريق إليك',picked_up:'المندوب استلم الأوردر',heading_customer:'المندوب في الطريق للعميل',completed:'تم تسليم الأوردر للعميل ✓',cancelled:'ملغي',disputed:'قيد المراجعة'},STP=['assigned','heading_pickup','picked_up','heading_customer','completed'],STL=['قبول','للمحل','استلام','للعميل','تسليم'];
const dltrk=x=>{const i=STP.indexOf(x.status);return i<0||x.legacy?'':'<div class="dl-trk" aria-hidden="true">'+STP.map((s,k)=>'<span class="'+(k<i||x.status=='completed'?'d':k==i?'c':'')+'">'+STL[k]+'</span>').join('')+'</div>'};
const OST={searching:'بانتظار مندوب',assigned:'مندوب قبل الطلب',heading_pickup:'المندوب في الطريق للمحل',picked_up:'المندوب استلم الطلب',heading_customer:'في الطريق للعميل',arrived:'وصل للعميل',awaiting_confirmation:'تم التسليم — بانتظار تأكيد العميل',completed:'مكتمل ✓',cancelled:'ملغي',disputed:'قيد المراجعة'};
const OPENST=['searching','assigned','heading_pickup','picked_up','heading_customer','arrived','awaiting_confirmation'];
const dlmin=x=>x<60?'أقل من دقيقة':Math.round(x/60)+' د';
const dltxt=it=>{const q=it.filter(x=>x.status=='searching').length;if(q)return 'جاري البحث عن مندوب…'+(q>1?' ('+q+' طلبات)':'');const a=it.find(x=>['assigned','heading_pickup'].includes(x.status));if(a)return a.courier_name?'المندوب '+a.courier_name+' في الطريق إليك':'المندوب في الطريق إليك';const g=it.find(x=>['picked_up','heading_customer'].includes(x.status));if(g)return (g.late?'⚠ متأخر — ':'')+(g.status=='picked_up'?'المندوب استلم الأوردر':'المندوب في الطريق للعميل');return it.length&&it[0].status=='completed'?(it[0].legacy?'آخر أوردر اتسلّم للمندوب ✓':'آخر أوردر اتسلّم للعميل ✓'):'جاهز — اضغط عند الحاجة لمندوب'};
const dlrows=it=>it.slice(0,8).map(x=>{const t=[];if(x.accepted_at)t.push('قبول بعد '+dlmin(x.accepted_at-x.created_at));if(x.picked_at&&(x.status=='completed'||x.status=='picked_up'||x.status=='heading_customer'))t.push('استلام بعد '+dlmin(x.picked_at-x.created_at));if(x.leg_secs!=null)t.push((x.delivered_at?'توصيل ':'في الطريق للعميل ')+dlmin(x.leg_secs));if(x.total_secs!=null)t.push('الإجمالي '+dlmin(x.total_secs));if(x.late)t.push('⚠ متأخر');if(x.fast)t.push('سريع جدًا — راجع');if(x.delivered_by=='shop')t.push('أكّدتَ التسليم');return `<div class="dl-it"><b>#${esc(x.id)}</b> — ${esc(DLS[x.status]||x.status)}${x.courier_name?' — '+esc(x.courier_name):''}${x.courier_phone?` <a href="tel:${esc(x.courier_phone)}">${esc(x.courier_phone)}</a>`:''}${x.pd_cust_phone?'<br><small>العميل: <a href="tel:'+esc(x.pd_cust_phone)+'">'+esc(x.pd_cust_phone)+'</a></small>':''}${x.pd_price!=null?'<br><small>السعر: '+esc(x.pd_price)+' ج</small>':''}${x.pd_note?'<br><small>التفاصيل: '+esc(x.pd_note)+'</small>':''}${x.dropoff_text?'<br><small>العنوان: '+esc(x.dropoff_text)+'</small>':''}${dltrk(x)}${t.length?'<br><small>'+t.join(' · ')+'</small>':''}${['picked_up','heading_customer'].includes(x.status)?`<button class="dl-x" onclick="dldone(${+x.id})">تم التسليم</button>`:''}${['searching','assigned','heading_pickup'].includes(x.status)?`<button class="dl-x" onclick="dlx(${+x.id})">إلغاء</button>`:''}</div>`}).join('');
const dlcard=d=>`<div class="dl" id="dlw"><h3>اطلب مندوب</h3><p class="sub">اضغط الزر وأول مندوب متاح يستلم الأوردر من محلك</p><div class="dl-row"><div class="dl-well"><button class="dl-btn" id="dlb" onclick="dlsend()" aria-label="اطلب دليفري"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h5l3-7h3M14 10l-2-3H9"/></svg><span>اطلب دليفري</span></button></div><div class="dl-ring${d.items.some(x=>x.status=='searching')?' go':''}" id="dlr" aria-hidden="true"></div></div><div class="dl-st" id="dls" role="status">${esc(dltxt(d.items))}</div><details class="dl-opt"><summary>＋ تفاصيل الأوردر (اختياري): رقم العميل والسعر</summary><input id="dlp" value="${esc(TXF.dlp)}" type="tel" inputmode="tel" maxlength="20" placeholder="رقم العميل" autocomplete="off"><input id="dlm" value="${esc(TXF.dlm)}" type="number" inputmode="decimal" min="0" step="any" placeholder="سعر الأوردر (ج)"><input id="dln" value="${esc(TXF.dln)}" maxlength="500" placeholder="تفاصيل الأوردر — مثال: كيسين، دفع عند الاستلام"><input id="dla" maxlength="300" placeholder="عنوان العميل"></details><div id="dll">${dlrows(d.items)}</div></div>`;
const ordCard=x=>`<div class="card"><b>طلب #${esc(x.id)}</b> <small>${esc(OST[x.status]||x.status)}</small><br>${x.items.map(i=>`${esc(i.qty)}× ${esc(i.name)} <small>— ${esc(Math.round(i.qty*i.price*100)/100)} ج</small>`).join('<br>')}<br><b>الإجمالي: ${esc(x.items_total)} ج</b>${x.note?`<br><small>ملاحظة العميل: ${esc(x.note)}</small>`:''}${x.courier_name?`<br><small>المندوب: ${esc(x.courier_name)}${x.courier_phone?` — <a href="tel:${esc(x.courier_phone)}">${esc(x.courier_phone)}</a>`:''}</small>`:''}${x.can_reject?`<div class="row"><button class="r" onclick="ordrej(${+x.id})">رفض الطلب</button></div>`:''}<small>رقم الطلب يعرفه المندوب عند الاستلام. ثمن الأصناف يُحاسَب بينك وبين العميل.</small></div>`;
const ordInner=(dl,od)=>(dl.enabled?dlcard(dl):'<div class="card"><small>طلب المندوب من المحل غير مفعّل حاليًا.</small></div>')+'<div class="lb">طلبات العملاء</div>'+(od.items.length?od.items.map(ordCard).join(''):'<div class="card"><small>لا توجد طلبات من العملاء بعد.</small></div>');
const ordLoad=async id=>{const f=async p=>{try{return await api('/owner/shops/'+id+p)}catch(e){return {enabled:false,items:[]}}};return [await f('/delivery-requests'),await f('/orders')]};
async function poll(){if(document.hidden||!SEL||TAB!='o'||BUSY||DLB)return;try{const el=$('oslot');if(!el||el.contains(document.activeElement))return;const [dl,od]=await ordLoad(SEL);if(!BUSY&&!DLB&&!el.contains(document.activeElement))el.innerHTML=ordInner(dl,od)}catch(e){}}
setInterval(poll,12000);
if(typeof addEventListener=='function')addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(({m:1,i:1,o:1})[k])stab(k)});
document.addEventListener('input',e=>{if(!e.target)return;if(e.target.id=='dla')TYP=e.target.value;else if(e.target.id in TXF)TXF[e.target.id]=e.target.value});
window.dlsend=async()=>{if(DLB||!SEL)return;DLB=1;const b=$('dlb'),r=$('dlr');if(b){b.disabled=true;if(b.classList)b.classList.add('on')}if(r&&r.classList)r.classList.add('go');navigator.vibrate&&navigator.vibrate(25);
 try{DLK=DLK||(typeof crypto!='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());const g=id=>(($(id)||{}).value||'').trim();await api('/owner/shops/'+SEL+'/delivery-request',{request_key:DLK,dropoff_text:g('dla'),customer_phone:g('dlp'),price:g('dlm'),note:g('dln')});DLK='';TYP='';TXF={dlp:'',dlm:'',dln:''}}catch(e){alert(e&&e.message?e.message:e)}DLB=0;await load()};
window.dldone=run(async id=>{if(!confirm('تأكيد: الأوردر وصل للعميل؟'))return;await api('/owner/shops/'+SEL+'/delivery-requests/'+id+'/delivered',{});msg='تم تأكيد التسليم.'});
window.dlboard=()=>{if(window.dlbMain)return dlbMain();const sc=document.createElement('script');sc.src='/shop-dash.js?v=1';sc.onload=()=>window.dlbMain&&dlbMain();sc.onerror=()=>alert('تعذّر تحميل لوحة الدليفري');document.head.appendChild(sc)};  /* م79: تُحمَّل عند أول ضغط فقط */
window.dlx=run(async id=>{if(!confirm('إلغاء طلب المندوب؟'))return;await api('/delivery/orders/'+id+'/cancel',{})});
window.ordrej=run(async id=>{if(!confirm('رفض هذا الطلب؟ سيُلغى ويُبلَّغ العميل والمندوب.'))return;await api('/owner/shops/'+SEL+'/orders/'+id+'/reject',{});msg='تم رفض الطلب.'});
async function load(){if(!T){m.innerHTML='<div class="card">سجّل الدخول من <a href="/">الصفحة الرئيسية</a>.</div>';$('tb').innerHTML='';return}
try{const o=await api('/owner/shops');const L=o.items,ap=L.filter(s=>s.status=='approved');
if(!ap.some(s=>s.id==SEL))SEL=ap.length?ap[0].id:0;if(SEL)localStorage.setItem('shsel',SEL);
const list=L.length?`<h2 class="sec">محلاتي</h2>`+L.map(s=>`<div class="card"><b>${esc(s.name_ar)}</b> <small>${esc(s.type_name)} — ${esc(ST[s.status]||s.status)}</small><br><small>${esc(s.region_name)} — ${esc(s.address)}</small>${s.review_reason?`<p class="${s.status=='approved'?'':'e'}"><small>السبب: ${esc(s.review_reason)}</small></p>`:''}${s.status=='pending'?'<p><small>طلبك بانتظار مراجعة الإدارة.</small></p>':''}</div>`).join(''):'';
const apply='';
let home='',items='',orders='',n=0,no=0;
if(ap.length){const s=ap.find(x=>x.id==SEL);
home=(ap.length>1?`<div class="card"><label><small>المحل الذي تديره</small><select id="shsel" onchange="shpick(this.value)">${ap.map(x=>`<option value="${x.id}" ${x.id==SEL?'selected':''}>${esc(x.name_ar)} — ${esc(x.type_name)}</option>`).join('')}</select></label></div>`:'')+
`<div class="card"><b>${esc(s.name_ar)}</b> <small>${esc(s.type_name)}</small><p>${s.is_open?'<b class="okm">مفتوح الآن للعملاء</b>':'<b>مغلق الآن</b>'}</p><button class="${s.is_open?'r':''}" onclick="shtog(${s.id},${s.is_open?0:1})">${s.is_open?'غلق المحل':'فتح المحل'}</button><small>الفتح والغلق يدوي. المحل المغلق لا يستقبل طلبات.</small></div>`;
