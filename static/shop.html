<header class="ph"><div class="in"><a class="back" href="/" aria-label="رجوع للتطبيق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>رجوع للتطبيق</span></a><div class="tt"><img class="lg" src="/assets/logo.jpg" alt=""><h1>لوحة المحل</h1></div><div class="ph-end" id="ph-end"></div></div></header><main id="m"></main><div class="tb" id="tb" role="tablist" aria-label="أقسام اللوحة"></div><script src="/notif.js" defer></script><script src="/shop-identity.js" defer></script><script>
/* المرحلة 68 (م3 المحلات): لوحة المحل. المرحلة 69 (م4): تبويب «الطلبات» = زر «اطلب مندوب» (نفس بطاقة الصيدلية) + طلبات العملاء من المحل. الصلاحية = وجود محل معتمد للمالك؛ كل النصوص القادمة من الخادم تمر عبر esc. */
const T=localStorage.getItem('t'),R=+localStorage.getItem('rg')||0,m=document.getElementById('m'),$=i=>document.getElementById(i);
let DLB=0,DLK='',TYP='',TXF={dlp:'',dlm:'',dln:''},msg='',isErr=0,TAB=({m:1,i:1,o:1})[location.hash.slice(1)]?location.hash.slice(1):'m',SEL=+localStorage.getItem('shsel')||0,SAVED=null,BUSY=0;const EIMG={},OPEN={};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,b)=>{const r=await fetch('/api'+p,{method:b===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw j.error;return j};
const KEEP=['in','ip','id','an','aa','ap','at','dla'];const snap=()=>{SAVED={};KEEP.forEach(k=>{const e=$(k);if(e)SAVED[k]=e.value})};const restore=()=>{if(!SAVED)return;KEEP.forEach(k=>{const e=$(k);if(e&&SAVED[k]!=null)e.value=SAVED[k]});SAVED=null};
const run=f=>async(...a)=>{if(BUSY)return;BUSY=1;msg='';isErr=0;snap();try{await f(...a);SAVED=null}catch(e){msg=e&&e.message?e.message:e;isErr=1}BUSY=0;await load();restore()};
const ST={pending:'قيد المراجعة',approved:'معتمد',rejected:'مرفوض',suspended:'موقوف'};
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=()=>no('تعذّرت قراءة الملف');r.readAsDataURL(f)});
async function upl(files,max){const fs=[...(files||[])];if(fs.length>max)throw 'الحد الأقصى '+max+' صور للصنف';const ids=[];try{for(const f of fs){let blob=f;if(window.LqImg){try{blob=(await LqImg.pick(f,{max:1280})).blob}catch(e){blob=f}}if(blob.size>4e6)throw 'الصورة كبيرة (الحد 4 ميجابايت)';ids.push((await api('/files',{data:await b64(blob)})).id)}}catch(e){await drop(ids);throw e}return ids}
window.pvw=el=>{const b=el.closest('label').nextElementSibling;if(!b)return;b.innerHTML='';[...el.files].slice(0,10).forEach(f=>{if(!/^image\//.test(f.type))return;const i=document.createElement('img');i.alt='معاينة';i.style.cssText='height:64px;width:64px;object-fit:cover;border-radius:8px;margin:0 0 6px 6px';i.onload=()=>URL.revokeObjectURL(i.src);i.src=URL.createObjectURL(f);b.appendChild(i)});if(el.files.length)b.insertAdjacentHTML('beforeend','<br><small>معاينة — هتتصغّر الصور تلقائيًا قبل الرفع.</small>')};
async function drop(ids){for(const i of ids){try{await api('/files/'+i+'/delete',{})}catch(e){}}}  /* تنظيف أفضل جهد لصور رُفعت ثم فشل الحفظ (تُحسب في سقف الملفات) */
const SHOP_IMG_URLS=new Map(),SHOP_IMG_PENDING=new Map();let SHOP_IMG_OBSERVER=null;
async function img(id,el){
 const key=String(id);if(SHOP_IMG_URLS.has(key)){el.src=SHOP_IMG_URLS.get(key);el.dataset.imgLoaded='1';return}
 let task=SHOP_IMG_PENDING.get(key);
 if(!task){task=(async()=>{const r=await fetch('/api/files/'+encodeURIComponent(key),{headers:{Authorization:'Bearer '+T}});if(!r.ok)throw new Error('تعذّر تحميل الصورة');const url=URL.createObjectURL(await r.blob());SHOP_IMG_URLS.set(key,url);return url})().finally(()=>SHOP_IMG_PENDING.delete(key));SHOP_IMG_PENDING.set(key,task)}
 try{const url=await task;if(el.isConnected){el.src=url;el.dataset.imgLoaded='1'}}catch(e){if(el.isConnected)el.dataset.imgError='1'}
}
function observeShopImages(){
 const images=document.querySelectorAll('img[data-im]:not([data-img-loaded]):not([data-img-error])');
 if(!('IntersectionObserver' in window)){images.forEach(el=>img(el.dataset.im,el));return}
 if(!SHOP_IMG_OBSERVER)SHOP_IMG_OBSERVER=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;const el=entry.target;SHOP_IMG_OBSERVER.unobserve(el);img(el.dataset.im,el)}},{rootMargin:'240px 0px'});
 images.forEach(el=>SHOP_IMG_OBSERVER.observe(el));
}
const IC={m:'<path d="M4 10l1-5h14l1 5M5 10v9h14v-9M9 19v-5h6v5"/>',i:'<path d="M5 7h14M5 12h14M5 17h9"/>',o:'<path d="M6 7h12l-1 11H7L6 7zM9 7a3 3 0 016 0"/>'};
const tabs=(n,no)=>[['m','المحل',0],['i','الأصناف',n],['o','الطلبات',no]].map(([k,l,c])=>`<button role="tab" data-tab="${k}" class="${TAB==k?'on':''}" aria-selected="${TAB==k}" onclick="stab('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg><span>${l}</span>${c?`<i class="bd">${c}</i>`:''}</button>`).join('');
window.stab=k=>{TAB=k;if(k=='o')poll();try{history.replaceState(null,'','#'+k)}catch(e){}document.querySelectorAll('.tp').forEach(s=>s.classList.toggle('on',s.dataset.t==k));document.querySelectorAll('#tb button').forEach(b=>{const o=b.dataset.tab==k;b.classList.toggle('on',o);b.setAttribute('aria-selected',o)});scrollTo(0,0)};
const sec=(k,h)=>`<section class="tp${TAB==k?' on':''}" data-t="${k}">${h}</section>`;
window.shopAction=(key)=>{const map={orders:['o',null],items:['i',null],categories:['i','category-panel'],additem:['i','dia'],delivery:['o','dlbw']};const target=map[key];if(!target)return;stab(target[0]);if(target[1])setTimeout(()=>{const el=$(target[1]);if(el){if(target[1]==='dia')el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}},80)};
window.shpick=v=>{SEL=+v;localStorage.setItem('shsel',SEL);load()};
window.shtog=run(async(id,open)=>{await api('/owner/shops/'+id+'/'+(open?'open':'close'),{});msg=open?'تم فتح المحل — يظهر مفتوحًا للعملاء':'تم غلق المحل'});
window.shap=run(async()=>{if(!R)throw 'اختر منطقتك من الصفحة الرئيسية أولًا';await api('/shops/apply',{type_id:+$('at').value,name_ar:$('an').value,address:$('aa').value,phone:$('ap').value,region_id:R});msg='تم إرسال طلب انضمام المحل للإدارة.'});
const catOptions=(cats,selected)=>'<option value="">بدون قسم</option>'+cats.map(c=>'<option value="'+(+c.id)+'" '+(+selected===+c.id?'selected':'')+'>'+esc(c.name_ar)+'</option>').join('');
const categoryPanel=cats=>'<div class="card" id="category-panel"><b>أقسام المحل</b><div class="row"><input id="catnew" maxlength="50" placeholder="اسم قسم جديد"><button onclick="catadd()">إضافة قسم</button></div>'+(cats.length?cats.map(c=>'<div class="row"><b>'+esc(c.name_ar)+'</b><span><button class="line" onclick="catedit('+c.id+')">تعديل</button><button class="r" onclick="catdel('+c.id+')">أرشفة</button></span></div>').join(''):'<small>لا توجد أقسام بعد.</small>')+'</div>';
window.catadd=run(async()=>{await api('/owner/shops/'+SEL+'/categories',{name_ar:$('catnew').value.trim()});msg='تم إنشاء القسم.'});
window.catedit=run(async id=>{const name=prompt('اسم القسم الجديد');if(!name)return;await api('/owner/shops/'+SEL+'/categories/'+id+'/edit',{name_ar:name});msg='تم تعديل القسم.'});
window.catdel=run(async id=>{if(!confirm('أرشفة القسم؟ الأصناف لن تُحذف وستصبح بدون قسم.'))return;await api('/owner/shops/'+SEL+'/categories/'+id+'/delete',{});msg='تمت أرشفة القسم.'});
const itemForm=(mx,req,cats)=>`<details class="card acc" id="dia" ${OPEN.dia?'open':''} ontoggle="OPEN.dia=this.open"><summary>＋ إضافة صنف جديد</summary><div class="acb"><input id="in" maxlength="80" placeholder="اسم الصنف"><div class="g2"><input id="ip" type="number" min="0" step="0.01" inputmode="decimal" placeholder="السعر (جنيه)"></div><select id="ic" aria-label="قسم الصنف">${catOptions(cats)}</select><textarea id="id" maxlength="500" placeholder="وصف (اختياري)"></textarea><label><small>صور الصنف (حتى ${mx}، JPG/PNG)${req?' — إجبارية لهذا النوع':''}</small><input id="if" type="file" accept="image/*" multiple onchange="pvw(this)"></label><div class="pv"></div><button onclick="iadd()">إضافة الصنف</button></div></details>`;
window.iadd=run(async()=>{const mx=+(($('if').dataset||{}).mx)||5;const ids=await upl($('if').files,mx);try{await api('/owner/shops/'+SEL+'/items',{name_ar:$('in').value,price:$('ip').value,description:$('id').value,image_ids:ids,category_id:$('ic').value?+$('ic').value:null})}catch(e){await drop(ids);throw e}OPEN.dia=0;msg='تمت إضافة الصنف.';SAVED=null;['in','ip','id'].forEach(k=>{const e=$(k);if(e)e.value=''})});
window.iav=run(async(id,v)=>{await api('/owner/shops/'+SEL+'/items/'+id+'/edit',{is_available:!!v})});
window.idl=run(async id=>{if(!confirm('حذف هذا الصنف؟'))return;const r=await api('/owner/shops/'+SEL+'/items/'+id+'/delete',{});await drop(r.freed_image_ids||[]);msg='تم حذف الصنف.'});
window.irm=(id,f,btn)=>{EIMG[id]=(EIMG[id]||[]).filter(x=>x!=f);btn.parentNode.remove()};
window.isv=run(async(id,mx)=>{const keep=[...(EIMG[id]||[])];const add=await upl($('ef'+id).files,Math.max(0,mx-keep.length));try{await api('/owner/shops/'+SEL+'/items/'+id+'/edit',{name_ar:$('en'+id).value,price:$('ep'+id).value,description:$('ed'+id).value,image_ids:keep.concat(add),category_id:$('ec'+id).value?+$('ec'+id).value:null})}catch(e){await drop(add);throw e}OPEN['e'+id]=0;msg='تم حفظ الصنف.'});
const formatOptionLines=groups=>(groups||[]).map(g=>(g.kind==='addon'?'+':'')+g.name_ar+(g.kind==='variant'?(g.required?'!':'?'):'')+': '+g.values.map(v=>v.name_ar+' | '+v.price_delta).join(', ')).join(String.fromCharCode(10));
function parseOptionLines(raw){const groups=[];for(const line of String(raw||'').split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean)){const at=line.indexOf(':');if(at<1)throw 'اكتب اسم المجموعة ثم نقطتين ثم الاختيارات';let label=line.slice(0,at).trim(),kind=label.startsWith('+')?'addon':'variant';if(kind==='addon')label=label.slice(1).trim();const required=kind==='variant'&&!label.endsWith('?');label=label.replace(/[!?]$/,'').trim();const values=line.slice(at+1).split(',').map(part=>{const p=part.split('|'),name=p[0].trim(),price=p.length>1?Number(p.slice(1).join('|').trim()):0;if(!name||!Number.isFinite(price))throw 'راجع اسم الاختيار وفرق السعر';return {name_ar:name,price_delta:price}});if(!label||!values.length)throw 'اسم المجموعة والاختيارات مطلوبان';groups.push({name_ar:label,kind,required,values})}return groups}
window.opsave=run(async id=>{const groups=parseOptionLines($('op'+id).value);await api('/owner/shops/'+SEL+'/items/'+id+'/options',{groups});msg='تم حفظ الأحجام والإضافات.'});
const itemCard=(x,mx,cats)=>{EIMG[x.id]=EIMG[x.id]||x.image_ids.slice();return `<div class="card item-card" id="it${x.id}" data-item-search="${esc(x.name_ar+' '+(x.description||''))}" data-item-category="${+x.category_id||0}" data-item-available="${x.is_available?'1':'0'}">${x.image_ids.map(f=>`<img alt="" data-im="${+f}" style="height:70px;border-radius:10px;margin:0 0 6px 6px">`).join('')}<br><b>${esc(x.name_ar)}</b> <small>${x.is_available?'متاح':'<span class="e">غير متاح</span>'}</small><br>${esc(x.price)} ج<br><small>${esc((cats.find(c=>+c.id===+x.category_id)||{}).name_ar||'بدون قسم')}</small>${x.description?`<br><small>${esc(x.description)}</small>`:''}<div class="row"><button class="line" onclick="iav(${x.id},${x.is_available?0:1})">${x.is_available?'غير متاح':'متاح'}</button><button class="r" onclick="idl(${x.id})">حذف</button></div><details class="hint" ${OPEN['e'+x.id]?'open':''} ontoggle="OPEN['e'+${x.id}]=this.open"><summary>تعديل</summary><input id="en${x.id}" maxlength="80" value="${esc(x.name_ar)}" aria-label="اسم الصنف"><input id="ep${x.id}" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(x.price)}" aria-label="السعر"><textarea id="ed${x.id}" maxlength="500" aria-label="الوصف">${esc(x.description)}</textarea><select id="ec${x.id}" aria-label="قسم الصنف">${catOptions(cats,x.category_id)}</select><div>${x.image_ids.map(f=>`<span style="display:inline-block;position:relative;margin:0 0 6px 6px"><img alt="" data-im="${+f}" style="height:56px;border-radius:8px"><button type="button" class="r" aria-label="إزالة الصورة" onclick="irm(${x.id},${+f},this)" style="position:absolute;top:-6px;left:-6px;padding:0 6px;min-height:0">✕</button></span>`).join('')}</div><label><small>إضافة صور (المجموع حتى ${mx})</small><input id="ef${x.id}" type="file" accept="image/*" multiple onchange="pvw(this)"></label><div class="pv"></div><button onclick="isv(${x.id},${mx})">حفظ التعديل</button></details><details class="hint"><summary>الأحجام والإضافات</summa
