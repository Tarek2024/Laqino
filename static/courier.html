<div>من: ${esc(o.pickup_text)}</div><div>إلى: ${esc(o.dropoff_text)}</div>${o.dropoff_lat!=null&&o.dropoff_lng!=null?`<div><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.dropoff_lat+','+o.dropoff_lng)}" target="_blank" rel="noopener noreferrer">📍 افتح موقع التسليم على الخريطة</a></div>`:''}${o.customer_phone?`<div>العميل: ${esc(o.customer_name)} — <a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a></div>`:''}${o.details?`<div>تفاصيل: ${esc(o.details)}</div>`:''}${o.fare_status=='draft'||o.fare_status=='proposed'?`<div><b>${o.fare_status=='draft'?(o.offer_fee!=null?'أجرة العميل المقترحة':'الأجرة الافتراضية للمنطقة'):'الأجرة المقترحة'}: ${esc(o.fee)} ج</b> <small>(تقدر تعدّلها، والعميل يوافق قبل البدء)</small></div><input id="fe${o.id}" type="number" min="1" value="${esc(o.fee)}" aria-label="الأجرة"><button onclick="fare(${o.id})">${o.fare_status=='draft'?'إرسال الأجرة للعميل':'تعديل الأجرة المقترحة'}</button>${o.fare_status=='proposed'?'<div><small>بانتظار موافقة العميل على الأجرة…</small></div>':''}`:`<div>الرسوم: ${esc(o.fee)} ج</div>`}

const RS={pending:'حسابك قيد مراجعة الإدارة',suspended:'حسابك موقوف، تواصل مع الإدارة',rejected:'طلب انضمامك مرفوض'};ONL=st.online;
PS=await pushState();const top=`<div class="card"><b>الحالة: <span class="${st.online?'ok':'no'}">${st.online?'متصل':'غير متصل'}</span></b> <small>(${esc(st.status=='approved'?'حساب معتمد':RS[st.status]||st.status)})</small>${st.reasons.length?`<ul>${st.reasons.map(x=>`<li class="no">${esc(x)}</li>`).join('')}</ul>`:''}${st.status=='approved'?`<button onclick="setOn(${st.online?'false':'true'})">${st.online?'قطع الاتصال':'اتصل بالشبكة'}</button><br><small>لا تُعرض عليك الطلبات للقبول إلا وأنت متصل وهذه الصفحة مفتوحة. فعّل «التنبيهات خارج التطبيق» لتصلك رسالة عند وجود طلب جديد والتطبيق مغلق.</small>`:''}</div>`;

const act=mo.filter(o=>!DONE.includes(o.status)),old=mo.filter(o=>DONE.includes(o.status)).slice(0,5);
if(!PF){try{PF=await api('/couriers/'+st.user_id+'/profile')}catch(e){}}if(st.has_avatar&&!AVU){try{const r=await fetch('/api/couriers/'+st.user_id+'/photo',{headers:{Authorization:'Bearer '+T}});if(r.ok)AVU=URL.createObjectURL(await r.blob())}catch(e){}}
notify(a);m.innerHTML=top+profCard(st)+pushCard()+`<div class="card"><b>الرصيد</b><div class="k"><b>المتاح: ${w.available!=null?w.available:w.balance} ج</b></div><small>الرصيد الكلي: ${w.balance} ج${w.held?' — محجوز لطلبات جارية: '+w.held+' ج':''}</small></div>
<div class="card"><b>طلباتي الحالية</b>${act.length?act.map(ordCard).join(''):'<p><small>لا توجد طلبات جارية.</small></p>'}</div>
<div class="card"><b>طلبات متاحة</b><small> (العناوين تظهر بعد القبول)</small>${a.length?a.map(o=>o.taken?`<div class="k" style="margin-top:8px"><span class="no">تم إسناد الطلب #${o.id} لمندوب آخر</span></div>`:`<div class="k" style="margin-top:8px" data-exp="${Date.now()+o.expires_in*1000}">طلب #${o.id} — ${esc(o.region_name)}<br>${o.origin_type=='provider_pickup'?'<b>🏪 استلام من صيدلية — بدون أجرة داخل التطبيق</b><br>':''}${o.offer_fee!=null?`<b>أجرة العميل: ${esc(o.offer_fee)} ج</b><br>`:''}<small>تنتهي المهلة خلال <b class="cd">${o.expires_in}</b> ث</small><br>${o.offer_fee!=null?`<button onclick="acc(${o.id})">قبول بـ${esc(o.offer_fee)} ج</button> <button class="s" onclick="acc(${o.id},1)">قبول وتعديل السعر</button>`:`<button onclick="acc(${o.id})">قبول</button>`} <button class="s" onclick="rej(${o.id})">رفض</button></div>`).join(''):`<p><small>${st.online?'لا توجد طلبات حاليًا.':'اتصل بالشبكة لتصلك الطلبات.'}</small></p>`}</div>
<div class="card"><b>أدائي</b><small> (من الطلبات الفعلية فقط)</small><div class="g"><div class="k"><b>${s.completed}</b>مكتملة</div><div class="k"><b>${pc(s.completion_rate)}</b>نسبة الاكتمال</div><div class="k"><b>${pc(s.release_rate)}</b>نسبة التخلي</div><div class="k"><b>${v(s.rating_avg)}</b>التقييم (${s.rating_count})</div></div></div>
<div class="card"><b>شحن الرصيد</b><small> (حوّل المبلغ ثم أدخل مرجع التحويل لتراجعه الإدارة)</small>${w.topup_instructions?`<div class="k" style="text-align:right;white-space:pre-wrap;margin:6px 0"><b style="font-size:.95rem">طريقة التحويل</b>${esc(w.topup_instructions)}</div>`:''}<input id="ta" type="number" min="1" placeholder="المبلغ بالجنيه"><input id="tr" placeholder="مرجع التحويل (4 أحرف على الأقل)"><input id="tn" placeholder="ملاحظة (اختياري)"><button onclick="topup()">إرسال طلب الشحن</button>
${w.topups.length?w.topups.slice(0,5).map(t=>`<p>${esc(t.amount)} ج — <span class="${t.status=='approved'?'ok':t.status=='rejected'?'no':''}">${esc(TS[t.status]||t.status)}</span>${t.reason?` (${esc(t.reason)})`:''}<br><small>${esc(t.transfer_ref)}</small></p>`).join(''):''}</div>
<div class="card"><b>حركة المحفظة</b>${w.entries.length?w.entries.slice(0,10).map(e=>`<p>${esc(KD[e.kind]||e.kind)}: <b class="${e.amount>=0?'ok':'no'}">${e.amount>0?'+':''}${e.amount} ج</b>${e.reason?` <small>(${esc(e.reason)})</small>`:''}</p>`).join(''):'<p><small>لا توجد حركات.</small></p>'}</div>
<div class="card"><b>آخر طلباتي المنتهية</b>${old.length?old.map(o=>`<p>#${o.id} — ${esc(ST[o.status]||o.status)} — ${esc(o.fee)} ج</p>`).join(''):'<p><small>لا يوجد.</small></p>'}</div>
<div class="card"><b>آخر التقييمات</b>${r.length?r.map(x=>`<p>${'★'.repeat(x.stars)} ${esc(x.comment||'')}</p>`).join(''):'<p><small>لا توجد تقييمات بعد.</small></p>'}</div><div class="card"><button class="s" onclick="signOut()">تسجيل الخروج</button></div>`}catch(e){m.innerHTML='<div class="card">'+esc(e)+'</div>'}}
let ONL=false,SEEN=new Set(),AC=null,RI=0;function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();const o=AC.createOscillator();o.connect(AC.destination);o.frequency.value=880;o.start();o.stop(AC.currentTime+.25)}catch(e){}}function notify(a){if(!a.some(o=>!o.taken)){if(RI){clearInterval(RI);RI=0}return}if(!RI){beep();RI=setInterval(()=>{if(!document.hidden)beep()},3000)}}if(document.addEventListener)document.addEventListener('pointerdown',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}},{passive:true});

function pushCard(){const t={on:'<span class="ok">مفعّلة على هذا الجهاز</span> <button class="s" onclick="pushOff()">إيقاف</button>',off:'<button onclick="pushOn()">تفعيل تنبيهات الطلبات الجديدة</button>',denied:'<span class="no">الإشعارات محظورة من إعدادات المتصفح لهذا الموقع</span>',unsupported:'<small>هذا المتصفح لا يدعم الإشعارات. على الآيفون: أضف التطبيق إلى الشاشة الرئيسية أولًا.</small>'}[PS];return `<div class="card"><b>التنبيهات خارج التطبيق</b><div>${t}</div><small>تصلك رسالة متكررة عند وجود طلب جديد في منطقتك حتى لو كان التطبيق مغلقًا، وتتوقف عند قبول الطلب أو إلغائه أو انتهاء مهلته، بشرط أن تكون قد اخترت «متصل» خلال آخر 12 ساعة. لا يصلك الطلب نفسه إلا بعد فتح التطبيق.</small></div>`}
const b64u=s=>{s=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
let PS='unsupported';async function pushState(){if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return 'unsupported';if(Notification.permission==='denied')return 'denied';try{const r=await navigator.serviceWorker.ready;return (await r.pushManager.getSubscription())?'on':'off'}catch(e){return 'off'}}
async function pushOn(){try{if(await Notification.requestPermission()!=='granted')return alert('لم يتم السماح بالإشعارات من إعدادات المتصفح');const r=await navigator.serviceWorker.ready,k=(await api('/courier/push/key')).key;const sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k)});await api('/courier/push/subscribe',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})});alert('تم تفعيل تنبيهات الطلبات الجديدة على هذا الجهاز')}catch(e){alert(e&&e.message||e)}load()}
async function pushOff(){try{const r=await navigator.serviceWorker.ready,sub=await r.pushManager.getSubscription();if(sub){await api('/courier/push/unsubscribe',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}}catch(e){alert(e&&e.message||e)}load()}
async function setOn(on){const p=(on&&PS==='off'&&'Notification' in window&&Notification.permission==='default')?pushOn():null;try{await api('/courier/online',{method:'POST',body:JSON.stringify({online:on})})}catch(e){alert(e)}if(p)await p;load()}
/* ===== صورة بروفايل المندوب (المرحلة 38): تُصغَّر في المتصفح ثم تُرفع عبر /api/files الحالي وتُربط بحساب المندوب نفسه ===== */
let PF=null,AVU=null;
function profCard(st){const nm=PF&&PF.name?PF.name:'مندوب';return `<div class="card pfc"><span class="av">${AVU?`<img src="${AVU}" alt="صورتك الشخصية">`:esc(nm.trim().charAt(0))}</span><div class="pi"><b>${esc(nm)}</b><small>الصورة والاسم يظهران للعميل قبل موافقته على أجرتك${PF&&PF.rating_count?` — ${PF.rating_avg} ★ (${PF.rating_count})`:''}</small><button class="s" onclick="document.getElementById('avf').click()">${AVU?'تغيير الصورة الشخصية':'إضافة صورة شخصية'}</button><span class="no" id="av_err" role="alert"></span></div></div>`}
function avShrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,480/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);cv.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
async function avPick(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;HOLD=true;const er=()=>document.getElementById('av_err');try{if(!/^image\//.test(f.type))throw 'اختر صورة JPG أو PNG';const b=await avShrink(f).catch(()=>{throw 'الصورة تالفة أو غير مدعومة'});const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(b)});const up=await api('/files',{method:'POST',body:JSON.stringify({data})});await api('/courier/avatar',{method:'POST',body:JSON.stringify({file_id:up.id})});AVU=null}catch(e){HOLD=false;await load();if(er())er().textContent=String(e);return}HOLD=false;load()}
async function rej(id){try{await api('/courier/orders/'+id+'/reject',{method:'POST',body:'{}'})}catch(e){alert(e)}load()}
async function hov(id){const c=document.getElementById('hc'+id).value.trim();try{await api('/courier/orders/'+id+'/handover',{method:'POST',body:JSON.stringify({code:c})});alert('تم إغلاق الطلب')}catch(e){alert(e)}load()}
setInterval(()=>{if(T&&ONL&&!document.hidden)api('/courier/heartbeat',{method:'POST',body:'{}'}).catch(()=>{})},15000);
setInterval(()=>{document.querySelectorAll('[data-exp]').forEach(e=>{const t=Math.max(0,Math.round((+e.dataset.exp-Date.now())/1000));const c=e.querySelector('.cd');if(c)c.textContent=t})},1000);
setInterval(()=>{if(T&&!HOLD&&!document.hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))load()},5000);
async function fare(id){try{await api('/courier/orders/'+id+'/fare',{method:'POST',body:JSON.stringify({fee:parseFloat(document.getElementById('fe'+id).value)})})}catch(e){alert(e)}load()}
async function acc(id,counter){try{await api('/courier/orders/'+id+'/accept',{method:'POST',body:JSON.stringify({counter:!!counter})})}catch(e){alert(e)}load()}
async function adv(id,to){try{await api('/courier/orders/'+id+'/status',{method:'POST',body:JSON.stringify({to})})}catch(e){alert(e)}load()}
async function rel(id){if(!confirm('هل تريد التخلي عن هذا الطلب؟ يؤثر ذلك على نسبة التخلي لديك.'))return;try{await api('/courier/orders/'+id+'/release',{method:'POST',body:'{}'})}catch(e){alert(e)}load()}
async function topup(){const g=i=>document.getElementById(i).value;try{await api('/courier/topups',{method:'POST',body:JSON.stringify({amount:parseFloat(g('ta')),transfer_ref:g('tr').trim(),note:g('tn')})});alert('تم إرسال طلب الشحن للمراجعة')}catch(e){alert(e)}load()}

const X=i=>document.getElementById(i),AR_ERR=e=>esc(typeof e=='string'?e:'حدث خطأ، حاول مرة أخرى');
function authView(reg){HOLD=true;m.innerHTML=`<div class="card"><b>${reg?'إنشاء حساب جديد':'تسجيل دخول المندوب'}</b>${reg?'<input id="x_nm" placeholder="الاسم" autocomplete="name">':''}<input id="x_ph" inputmode="numeric" placeholder="رقم الهاتف (01XXXXXXXXX)" autocomplete="username"><input id="x_pw" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="${reg?'new-password':'current-password'}"><button onclick="doAuth(${reg?1:0})">${reg?'إنشاء الحساب':'دخول'}</button><p><small>${reg?'لديك حساب؟':'ليس لديك حساب؟'}</small> <a href="#" onclick="authView(${reg?0:1});return false">${reg?'سجّل الدخول':'أنشئ حسابًا'}</a></p><div id="x_err" class="no"></div></div>`}
async function doAuth(reg){const b={phone:X('x_ph').value.trim(),password:X('x_pw').value},er=X('x_err');er.textContent='';try{if(reg){b.name=X('x_nm').value.trim();await api('/register',{method:'POST',body:JSON.stringify(b)})}
T=(await api('/login',{method:'POST',body:JSON.stringify({phone:b.phone,password:b.password})})).token;localStorage.setItem('t',T);HB=0;HOLD=false;load()}catch(e){er.innerHTML=/واتساب/.test(String(e))?'التسجيل الجديد يتطلب التحقق عبر واتساب. أنشئ حسابك من <a href="/">الصفحة الرئيسية</a> ثم ارجع هنا وسجّل الدخول.':AR_ERR(e)}}
function signOut(){PF=null;AVU=null;if(T)api('/logout',{method:'POST',body:'{}'}).catch(()=>{});T='';localStorage.removeItem('t');HB=0;authView()}
function statusView(st){const RS={pending:'طلبك قيد مراجعة الإدارة. سيتفعّل حسابك فور الموافقة.',rejected:'تم رفض طلب انضمامك.',suspended:'حسابك موقوف حاليًا، تواصل مع الإدارة.'};
return `<div class="card"><b>${esc(RS[st.status]||st.status)}</b>${st.review_reason?`<p class="no">السبب: ${esc(st.review_reason)}</p>`:''}${st.status=='rejected'?'<p><button onclick="applyView()">تقديم طلب جديد بمستندات جديدة</button></p>':''}${st.status=='pending'&&!st.has_documents?'<p class="no">طلبك بلا صورة البطاقة، أضفها لتتم مراجعته.</p><button onclick="applyView()">إضافة المستندات</button>':''}${st.status=='pending'?'<p><small>تتحدّث هذه الصفحة تلقائيًا.</small></p>':''}<button class="s" onclick="signOut()">تسجيل الخروج</button></div>`}
async function applyView(note){HOLD=true;m.innerHTML=`<div class="card"><b>طلب الانضمام كمندوب</b>${note?`<p class="no">${esc(note)}</p>`:''}<small>اختر منطقة عملك وارفع صورة البطاقة (وجه وظهر) لتراجعها الإدارة.</small><div id="x_rg"></div><label>البطاقة — الوجه<input type="file" id="x_f1" accept="image/jpeg,image/png"></label><label>البطاقة — الظهر<input type="file" id="x_f2" accept="image/jpeg,image/png"></label><label>صورة شخصية (اختياري)<input type="file" id="x_f3" accept="image/jpeg,image/png"></label><button id="x_go" onclick="sendApply()">إرسال الطلب</button> <button class="s" onclick="signOut()">خروج</button><div id="x_err" class="no"></div></div>`;try{await rgLevel(null,0)}catch(e){X('x_err').textContent=typeof e=='string'?e:'حدث خطأ، حاول مرة أخرى'}}
async function rgLevel(pid,depth){const box=X('x_rg');[...box.querySelectorAll('select')].filter(s=>+s.dataset.d>=depth).forEach(s=>s.remove());const l=await api('/regions'+(pid==null?'':'?parent_id='+pid));if(!l.length)return;
const s=document.createElement('select');s.dataset.d=depth;s.innerHTML=`<option value="">${depth?'كل المنطقة (اختياري)':'اختر المحافظة / المنطقة'}</option>`+l.map(x=>`<option value="${esc(x.id)}">${esc(x.name_ar)}</option>`).join('');s.onchange=()=>{rgLevel(s.value||null,depth+1).catch(()=>{})};box.appendChild(s)}
const rgPick=()=>{const v=[...X('x_rg').querySelectorAll('select')].map(s=>+s.value).filter(Boolean);return v.length?v[v.length-1]:0};
const rd64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=()=>no('تعذّرت قراءة الملف');r.readAsDataURL(f)});
async function sendApply(){const er=X('x_err'),bt=X('x_go');er.textContent='';try{const rid=rgPick();if(!rid)throw 'اختر منطقة عملك أولًا';const body={region_id:rid};bt.disabled=true;
for(const[k,id,req]of[['id_front_file_id','x_f1',1],['id_back_file_id','x_f2',1],['selfie_file_id','x_f3',0]]){const f=X(id).files[0];if(!f){if(req)throw 'ارفع صورة البطاقة (الوجه والظهر)';continue}if(f.size>4e6)throw 'الصورة كبيرة (الحد 4 ميجابايت)';body[k]=(await api('/files',{method:'POST',body:JSON.stringify({data:await rd64(f)})})).id}
await api('/couriers/apply',{method:'POST',body:JSON.stringify(body)});HOLD=false;load()}catch(e){er.textContent=typeof e=='string'?e:'حدث خطأ، حاول مرة أخرى';bt.disabled=false}}

load();
</script><script src="/pdelivery-courier.js"></script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script></body></html>
