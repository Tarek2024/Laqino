function route() { stopPoll(); var m = /^#\/l\/(\d+)$/.exec(location.hash), ch = /^#\/chat\/(\d+)$/.exec(location.hash); if (m) { chrome(false); detail(m[1]); } else if (ch) { chrome(false); chatView(ch[1]); } else if (location.hash === "#/chats") { chrome(false); chatsView(); } else if (location.hash === "#/fav") { chrome(false); favView(); } else { chrome(true); document.title = "سوق لاقينو"; list(true); } }
function fillCats() {
  api("/api/categories?section=souq").then(function (r) {
    r.data.filter(function (c) { return c.parent_id != null; }).forEach(function (c) { $("cat").appendChild(h("option", {value: c.id, text: c.name_ar})); });
  }).catch(function () {});
}
function fillRegions() {
  api("/api/regions").then(function (r) { if (!r.data.length) return; return api("/api/regions?parent_id=" + r.data[0].id); }).then(function (r) {
    if (r) r.data.forEach(function (g) { $("reg").appendChild(h("option", {value: g.id, text: g.name_ar})); });
  }).catch(function () {});
}
var timer; function soon() { clearTimeout(timer); timer = setTimeout(function () { if (!/^#\/l\//.test(location.hash)) list(true); }, 350); }
["q", "min", "max"].forEach(function (i) { $(i).addEventListener("input", soon); });
["cat", "reg", "cond", "sort"].forEach(function (i) { $(i).addEventListener("change", function () { if (/^#\/l\//.test(location.hash)) location.hash = "#/"; else list(true); }); });
if (typeof navigator !== "undefined" && navigator.serviceWorker) window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
$("mychats").addEventListener("click", function () { location.hash = "#/chats"; }); $("myfav").addEventListener("click", function () { location.hash = "#/fav"; }); window.addEventListener("hashchange", route); /* الموقع الموحد: لو للمستخدم منطقة محفوظة (يدويًا أو بالـGPS) تُحدَّد تلقائيًا في فلتر المنطقة؛ ويقدر يرجع لـ«كل المناطق». */
function myRegion() { try { var id = +localStorage.getItem("rg") || 0; if (!id) return; var o = h("option", {value: id, text: "منطقتي: " + (localStorage.getItem("rgn") || "المحفوظة")}); $("reg").insertBefore(o, $("reg").children[1] || null); $("reg").value = String(id); } catch (e) {} }
myRegion(); fillCats(); fillRegions(); route();
</script>
</body>
</html>
