<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f2a5c"><link rel="icon" href="/assets/icon-192.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>لاقينو — الصيدلية</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/panel.css"><link rel="stylesheet" href="/pdelivery.css"></head><body class="panel pharm">
<header class="ph"><div class="in"><a class="back" href="/" aria-label="رجوع للتطبيق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>رجوع للتطبيق</span></a><div class="tt"><img class="lg" src="/assets/logo.jpg" alt=""><h1>لوحة الصيدلية</h1></div><div class="ph-end" id="ph-end"></div></div></header><main id="m"></main><script src="/notif.js" defer></script><script>
const T=localStorage.getItem('t'),R=+localStorage.getItem('rg')||0,m=document.getElementById('m'),$=i=>document.getElementById(i);let msg='';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,b)=>{const r=await fetch('/api'+p,{method:b===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw j.error;return j};
const KEEP=['pt','pb','pk','pp','po','pd','xt','xd','xq','xe','xo','xp'];let SAVED=null;const snap=()=>{SAVED={};KEEP.forEach(k=>{const e=$(k);if(e)SAVED[k]=e.value})};const restore=()=>{if(!SAVED)return;KEEP.forEach(k=>{const e=$(k);if(e&&SAVED[k]!=null)e.value=SAVED[k]});SAVED=null};
const run=f=>async(...a)=>{msg='';snap();try{await f(...a);SAVED=null}catch(e){msg=e}await load();restore()};
const DS={searching:'بانتظار مندوب',assigned:'مندوب في الطريق إليك',heading_pickup:'مندوب في الطريق إليك',picked_up:'تم الاستلام',heading_customer:'في الطريق للعميل',arrived:'وصل للعميل',awaiting_confirmation:'بانتظار تأكيد العميل',completed:'مكتمل',cancelled:'ملغي',disputed:'قيد المراجعة'};const MS={available:'متوفر',unavailable:'غير متوفر',needs_confirmation:'يحتاج تأكيد'};
const form=(kind,id,my)=>`<select id="s${kind}${id}"><option value="available">متوفر</option><option value="unavailable">غير متوفر</option><option value="needs_confirmation">يحتاج تأكيد</option></select><input id="p${kind}${id}" type="number" min="0" placeholder="السعر (عند التوفر)"><input id="n${kind}${id}" placeholder="ملاحظة"><button onclick="rs('${kind}',${id})">${my?'تحديث ردي':'إرسال الرد'}</button>${my?`<small>ردك الحالي: ${esc(MS[my])}</small>`:''}`;
const offerBox=x=>`<div class="n"><b>طلب مفتوح لكل صيدليات المنطقة</b><br><small>أول صيدلية تقبل تحصل على حجز مؤقت للرد، ويختفي الطلب عن الباقين. اقبل فقط إن كنت ستجهّز التسعيرة.</small><div class="row"><button onclick="rxAccept(${x.id})">قبول الطلب والحجز</button><button class="line" onclick="rxDecline(${x.id})">اعتذار</button></div></div>`;
const claimNote=x=>x.claim_expires_at?`<small>الحجز ينتهي عند ${new Date(x.claim_expires_at*1000).toLocaleTimeString('ar-EG')} — أرسل التسعيرة قبلها.</small>`:'';
window.rxAccept=run(async id=>{const r=await api('/provider/prescriptions/'+id+'/accept',{});msg='تم الحجز لمدة '+r.claim_minutes+' دقائق — أرسل التسعيرة قبل انتهائها';await load()});
window.rxDecline=run(async id=>{if(!confirm('الاعتذار عن هذا الطلب؟ لن يظهر لصيدليتك مرة أخرى.'))return;await api('/provider/prescriptions/'+id+'/decline',{});msg='تم الاعتذار عن الطلب';await load()});
const qrow=(it={})=>{const st=it.item_status||(it.available===false||it.available===0?'unavailable':'available');return `<div class="qr" style="display:grid;grid-template-columns:2fr .7fr 1fr 1.2fr;gap:6px;margin:4px 0;align-items:center"><input class="qn" placeholder="اسم الدواء" aria-label="اسم الدواء" value="${esc(it.name||'')}"><input class="qq" type="number" min="1" max="99" aria-label="الكمية" value="${esc(it.qty||1)}"><input class="qp" type="number" min="0" step="0.01" placeholder="سعر الوحدة" aria-label="سعر الوحدة" value="${it.unit_price!=null?esc(it.unit_price):''}"><select class="qs" aria-label="حالة الصنف"><option value="available"${st==='available'?' selected':''}>متوفر</option><option value="unavailable"${st==='unavailable'?' selected':''}>غير متوفر</option><option value="needs_confirmation"${st==='needs_confirmation'?' selected':''}>يحتاج مراجعة</option></select></div>`};
const qform=x=>`<div><small>${x.requested_items&&x.requested_items.length?'مطلوب استكمال الأصناف الناقصة فقط: '+x.requested_items.map(i=>esc(i.name)+' ×'+esc(i.qty)).join('، '):'اكتب جميع الأصناف المذكورة في الروشتة، وحدد حالة كل صنف.'}</small><div id="qr${x.id}"></div><div class="row"><button class="line" onclick="qadd(${x.id})">+ بند</button></div><label><input id="qca${x.id}" type="checkbox"> أؤكد توافر جميع الأصناف المطلوبة دون استبدال أي صنف ببديل أو مثيل إلا بعد موافقة العميل.</label><input id="qn${x.id}" placeholder="ملاحظة (اختياري)"><button onclick="qsend(${x.id})">${x.my_status?'تحديث التسعيرة':'إرسال التسعيرة'}</button>${x.my_status?`<small>ردك الحالي: ${esc(MS[x.my_status])}${x.my_price!=null?' — '+esc(x.my_price)+' ج':''}</small><br>${x.my_review=='approved'?'<small>✔ اعتمدته الإدارة وظهر للعميل</small>':x.my_review=='rejected'?`<small class="e">رفضته الإدارة${x.my_review_reason?': '+esc(x.my_review_reason):''} — عدّله وأعد الإرسال</small>`:'<small>بانتظار اعتماد الإدارة قبل أن يراه العميل</small>'}`:''}</div>`;
window.qadd=id=>{$('qr'+id).insertAdjacentHTML('beforeend',qrow())};
window.qsend=run(async id=>{const rows=[...document.querySelectorAll('#qr'+id+' .qr')].map(r=>({name:r.querySelector('.qn').value.trim(),qty:r.querySelector('.qq').value,unit_price:r.querySelector('.qp').value,item_status:r.querySelector('.qs').value})).filter(r=>r.name);if(!rows.length)throw 'أضف بندًا واحدًا على الأقل';const r=await api('/provider/prescriptions/'+id+'/quote',{items:rows,confirm_all:$('qca'+id).checked,note:$('qn'+id).value});msg='تم إرسال التسعيرة — الإجمالي '+r.total+' ج';await load()});
window.qinit=async x=>{let its=[];try{its=(await api('/provider/prescriptions/'+x.id+'/quote')).items}catch(e){}if(!its.length)its=(x.requested_items&&x.requested_items.length)?x.requested_items.map(i=>({name:i.name,qty:i.qty,item_status:'available'})):[{},{},{}];const el=$('qr'+x.id);if(el)el.innerHTML=its.map(qrow).join('')};
window.rs=run(async(k,id)=>{await api('/provider/'+(k=='i'?'inquiries/':'prescriptions/')+id+'/respond',{status:$('s'+k+id).value,price:$('p'+k+id).value,note:$('n'+k+id).value})});
window.st=run(async()=>{await api('/provider/stock',{medicine_name:$('sn').value,available:$('sa').value=='1',price:$('sp').value});msg='تم تأكيد حالة الدواء.'});
const PF=14,PS={pending:'قيد المراجعة',approved:'منشور',rejected:'مرفوض'};
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=()=>no('تعذّرت قراءة الملف');r.readAsDataURL(f)});
window.pa=run(async()=>{const fs=[...($('pf').files||[])];if(fs.length>3)throw 'الحد الأقصى 3 صور';const ids=[];for(const f of fs){if(f.size>4e6)throw 'الصورة كبيرة (الحد 4 ميجابايت)';ids.push((await api('/listings/images',{data:await b64(f)})).id)}if(!$('pk').value)throw 'لا توجد تصنيفات منتجات متاحة — اطلب من الإدارة تفعيل تصنيفات القسم الطبي';await api('/provider/products',{title:$('pt').value,brand:$('pb').value,category_id:+$('pk').value,price:$('pp').value,old_price:$('po').value,description:$('pd').value,image_file_ids:ids});msg='تم إرسال المنتج للمراجعة.'});
async function pimgs(){for(const el of document.querySelectorAll('img[data-pi]')){try{const r=await fetch('/api/medical/products/'+el.dataset.pi.split('/')[0]+'/images/'+el.dataset.pi.split('/')[1],{headers:{Authorization:'Bearer '+T}});if(r.ok)el.src=URL.createObjectURL(await r.blob())}catch(e){}}}
window.pu=run(async id=>{const v=prompt('السعر الحالي (أو اتركه كما هو لتأكيده فقط):');if(v===null)return;await api('/provider/products/'+id+'/confirm',v.trim()?{price:v.trim()}:{});msg='تم تأكيد العرض.'});
window.pv=run(async(id,a)=>{await api('/provider/products/'+id+'/confirm',{available:!!a})});
window.px=run(async id=>{if(confirm('حذف هذا العرض؟'))await api('/provider/products/'+id+'/delete',{})});
window.ap=run(async()=>{if(!R)throw 'اختر منطقتك من الصفحة الرئيسية أولًا';await api('/providers/apply',{name_ar:$('an').value,address:$('aa').value,region_id:R});msg='تم إرسال طلبك للإدارة.'});
async function img(id,el){try{const r=await fetch('/api/files/'+id,{headers:{Authorization:'Bearer '+T}});el.src=URL.createObjectURL(await r.blob())}catch(e){}}

const XS={pending:'قيد المراجعة',approved:'منشور',rejected:'مرفوض/موقوف',reserved:'محجوز',sold:'تم البيع'};
async function eximgs(){for(const el of document.querySelectorAll('img[data-xi]')){const [d,f]=el.dataset.xi.split('/');try{const r=await fetch('/api/provider/exchange/'+(+d)+'/images/'+(+f),{headers:{Authorization:'Bearer '+T}});if(r.ok)el.src=URL.createObjectURL(await r.blob())}catch(e){}}}
const xph=(c,t)=>c?`<p><small>${t}: <b>${esc(c.pharmacy)}</b> — هاتف <a href="tel:${esc(c.phone)}" dir="ltr">${esc(c.phone)}</a></small></p>`:'';
const xim=x=>(x.images||[]).map(i=>`<img alt="" data-xi="${+x.id}/${+i}" style="height:90px;border-radius:10px;margin:0 0 6px 6px">`).join('');
const xrun=f=>async(...a)=>{msg='';snap();try{await f(...a);SAVED=null}catch(e){msg=e}await load();restore()};
window.xs=xrun(async()=>{const fs=[...($('xf').files||[])];if(!fs.length)throw 'أرفق صورة العبوة وتاريخ الصلاحية';if(fs.length>3)throw 'الحد الأقصى 3 صور';const ids=[];for(const f of fs){if(f.size>4e6)throw 'الصورة كبيرة (الحد 4 ميجابايت)';ids.push((await api('/listings/images',{data:await b64(f)})).id)}await api('/provider/exchange',{title:$('xt').value,details:$('xd').value,qty:$('xq').value,expiry_date:$('xe').value,orig_price:$('xo').value,price:$('xp').value,image_file_ids:ids});msg='تم إرسال الإعلان للمراجعة.'});
window.xr=xrun(async id=>{if(!confirm('حجز هذا الإعلان؟ سيظهر لك هاتف الصيدلية البائعة وتتفقان بينكما، وينتهي الحجز تلقائيًا بعد 48 ساعة.'))return;await api('/provider/exchange/'+id+'/reserve',{});msg='تم الحجز — بيانات البائع في «حجوزاتي».'});
window.xl=xrun(async id=>{if(confirm('فك الحجز؟'))await api('/provider/exchange/'+id+'/release',{})});
window.xo=xrun(async id=>{if(confirm('تأكيد أن البيع تم؟'))await api('/provider/exchange/'+id+'/sold',{})});
window.xx=xrun(async id=>{if(confirm('حذف هذا الإعلان؟'))await api('/provider/exchange/'+id+'/delete',{})});
window.xb=xrun(async id=>{const r=prompt('سبب البلاغ؟');if(r&&r.trim())await api('/provider/exchange/'+id+'/report',{reason:r.trim()});msg='وصل بلاغك للإدارة.'});
async function exload(){const w=$('exw');if(!w)return;try{const[bd,mine,rs]=await Promise.all([api('/provider/exchange?limit=50'),api('/provider/exchange/mine'),api('/provider/exchange/reservations')]);
const card=(x,mode)=>`<div class="card">${xim(x)}<br><b>${esc(x.title)}</b> <small>${esc(x.details||'')}</small><br><small>الكمية ${esc(x.qty)} — الصلاحية ${esc(x.expiry_date)} — <s>${esc(x.orig_price)}</s> <b>${esc(x.price)} ج</b> (خصم ${esc(x.discount_pct)}٪) — ${esc(x.pharmacy)} / ${esc(x.region_name)}${x.status?' — '+esc(XS[x.status]||x.status):''}</small>${x.reject_reason&&x.status=='rejected'?`<p class="e">${esc(x.reject_reason)}</p>`:''}${mode=='mine'?xph(x.buyer,'المشتري'):''}${mode=='res'?xph(x.seller,'البائع'):''}<div class="row">${mode=='board'?(x.mine?'<small>إعلانك</small>':x.status=='approved'?`<button onclick="xr(${+x.id})">حجز</button>`:'<small>محجوز</small>')+(x.mine?'':`<button class="line" onclick="xb(${+x.id})">بلاغ</button>`):''}${mode=='mine'?(x.status=='reserved'?`<button onclick="xo(${+x.id})">تم البيع</button><button class="line" onclick="xl(${+x.id})">فك الحجز</button>`:x.status!='sold'?`<button class="r" onclick="xx(${+x.id})">حذف</button>`:''):''}${mode=='res'&&x.status=='reserved'?`<button class="line" onclick="xl(${+x.id})">إلغاء حجزي</button>`:''}</div></div>`;
w.innerHTML=`<div class="card"><b>نشر دواء بخصم لصيدليات أخرى</b><small> (للصيدليات المعتمدة فقط ولا يراه العملاء. صلاحية متبقية 60 يومًا على الأقل، وخصم 5٪ على الأقل. ممنوع: المخدرات والمؤثرات العقلية وما يحتاج تبريد. لاقينو تربط فقط ولا تتعامل مع الفلوس؛ التزام الصيدلية بقوانين تداول الأدوية مسؤوليتها.)</small><input id="xt" maxlength="120" placeholder="اسم الدواء"><input id="xd" maxlength="500" placeholder="تفاصيل (التركيز، الشكل، التشغيلة)"><input id="xq" type="number" min="1" placeholder="الكمية"><input id="xe" placeholder="تاريخ الصلاحية كما على العبوة: 06/2027" dir="ltr" inputmode="numeric" maxlength="10"><input id="xo" type="number" min="0" step="0.01" placeholder="السعر الأصلي"><input id="xp" type="number" min="0" step="0.01" placeholder="سعر الخصم"><label><small>صور العبوة وتاريخ الصلاحية (1–3)</small><input id="xf" type="file" accept="image/*" multiple></label><button onclick="xs()">نشر في سوق الصيدليات</button></div>`
+'<b>حجوزاتي (دواء حجزته من صيدليات)</b>'+(rs.map(x=>card(x,'res')).join('')||'<div class="card"><small>لا توجد حجوزات.</small></div>')
+'<b>إعلاناتي</b>'+(mine.map(x=>card(x,'mine')).join('')||'<div class="card"><small>لا توجد إعلانات.</small></div>')
+'<b>المتاح من الصيدليات الأخرى</b>'+(bd.items.filter(x=>!x.mine).map(x=>card(x,'board')).join('')||'<div class="card"><small>لا توجد إعلانات متاحة الآن.</small></div>');eximgs();restore()}catch(e){w.innerHTML=`<div class="card"><small>${esc(e)}</small></div>`}}
async function load(){if(!T){m.innerHTML='<div class="card">سجّل الدخول من <a href="/">الصفحة الرئيسية</a>.</div>';return}
try{const[i,p,dv,po,pc]=await Promise.all([api('/provider/inquiries'),api('/provider/prescriptions'),api('/provider/deliveries'),api('/provider/products'),api('/medical/product-categories')]);
m.innerHTML=(msg?`<p class="e">${esc(msg)}</p>`:'')+`<div class="card"><b>تأكيد توافر دواء</b><small> (يظهر للعملاء بوقت التأكيد، ويُعتبر قديمًا بعد 24 ساعة)</small><input id="sn" placeholder="اسم الدواء"><select id="sa"><option value="1">متوفر</option><option value="0">غير متوفر</option></select><input id="sp" type="number" min="0" placeholder="السعر"><button onclick="st()">تأكيد</button></div>
<div class="card"><b>طلبات توصيل من عملاء</b><small> (يستلمها مندوب باسم المرجع؛ لا تظهر هوية العميل)</small>${dv.length?dv.map(x=>`<p>المرجع <b>${x.source_type=='inquiry'?'M':'R'}${esc(x.source_id)}</b>${x.medicine_name?' — '+esc(x.medicine_name):' — روشتة'} — ${esc(DS[x.status]||x.status)}${x.courier_name?' — المندوب: '+esc(x.courier_name):''}</p>`).join(''):'<p><small>لا توجد طلبات توصيل.</small></p>'}</div>
<div class="card"><b>عروض المنتجات — إضافة منتج</b><small> (تجميل، أم وطفل، عناية شخصية، مستلزمات — بدون أدوية. يظهر بعد مراجعة الإدارة، ويُخفى تلقائيًا إن لم تؤكّد سعره كل ${PF} يومًا)</small><input id="pt" maxlength="120" placeholder="اسم المنتج"><input id="pb" maxlength="60" placeholder="الماركة (اختياري)"><select id="pk">${pc.length?'':'<option value="">— لا توجد تصنيفات —</option>'}${pc.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select><input id="pp" type="number" min="0" inputmode="decimal" placeholder="السعر"><input id="po" type="number" min="0" inputmode="decimal" placeholder="السعر قبل الخصم (اختياري)"><textarea id="pd" maxlength="1000" placeholder="وصف (اختياري)"></textarea><label><small>صور المنتج (حتى 3، JPG/PNG)</small><input id="pf" type="file" accept="image/jpeg,image/png" multiple></label><button onclick="pa()">إرسال للمراجعة</button></div>${po.map(x=>`<div class="card">${(x.images||[]).map(i=>`<img alt="" data-pi="${x.id}/${+i}" style="height:70px;border-radius:10px;margin:0 0 6px 6px">`).join('')}<br><b>${esc(x.title)}</b> <small>${esc(x.category)} — ${PS[x.status]||esc(x.status)}${x.status=='approved'&&!x.available?' — غير متوفر':''}</small><br>${esc(x.price)} ج${x.old_price?` <small>(كان ${esc(x.old_price)})</small>`:''}${x.reject_reason?`<p class="e">سبب الرفض: ${esc(x.reject_reason)}</p>`:''}<br><small>آخر تأكيد: ${new Date(x.confirmed_at*1000).toLocaleDateString('ar-EG')}</small><div><button onclick="pu(${x.id})">تأكيد/تعديل السعر</button><button onclick="pv(${x.id},${x.available?0:1})">${x.available?'غير متوفر':'متوفر'}</button><button onclick="px(${x.id})">حذف</button></div></div>`).join('')||'<div class="card"><small>لا توجد عروض بعد.</small></div>'}
<h2 class="sec">سوق الصيدليات (بيع بخصم بين الصيدليات)</h2><div id="exw"></div><h2 class="sec">استعلامات العملاء</h2>`+(i.map(x=>`<div class="card"><b>${esc(x.medicine_name)}</b><br><small>${esc(x.note)}</small>${form('i',x.id,x.my_status)}</div>`).join('')||'<div class="card"><small>لا توجد استعلامات حاليًا.</small></div>')+`<h2 class="sec">روشتات محوّلة إليك من الإدارة</h2>`+(p.map(x=>`<div class="card">${(x.images&&x.images.length?x.images:[x.file_id]).map(f=>`<img data-im="${+f}" alt="روشتة" style="max-width:100%;margin-bottom:6px"><br>`).join('')}<small>${esc(x.note)}</small>${x.offer_state==='open'&&!x.claim_expires_at?offerBox(x):claimNote(x)+qform(x)}</div>`).join('')||'<div class="card"><small>لا توجد روشتات محوّلة.</small></div>');document.querySelectorAll('img[data-im]').forEach(el=>img(el.dataset.im,el));p.forEach(qinit);pimgs();exload()}
catch(e){m.innerHTML=`<div class="card"><b>طلب انضمام صيدلية</b><input id="an" placeholder="اسم الصيدلية"><input id="aa" placeholder="العنوان"><button onclick="ap()">إرسال للإدارة</button>${msg?`<p class="e">${esc(msg)}</p>`:`<small>${esc(e)}</small>`}</div>`}}
load();</script><script src="/pdelivery.js"></script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script></body></html>
