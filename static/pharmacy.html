const T=localStorage.getItem('t'),R=+localStorage.getItem('rg')||0,m=document.getElementById('m'),$=i=>document.getElementById(i);let msg='',isErr=0;const OPEN={};let TAB=({o:1,p:1,x:1,s:1})[location.hash.slice(1)]?location.hash.slice(1):'o';let RXQ=+((location.hash.match(/^#rx=(\d{1,12})$/)||[])[1])||0;/* phase64-step3: رابط مباشر #rx=<رقم الروشتة> */

const KEEP=['pt','pb','pk','pp','po','pd','xt','xd','xq','xe','xo','xp'];let SAVED=null;const snap=()=>{SAVED={};KEEP.forEach(k=>{const e=$(k);if(e)SAVED[k]=e.value})};const restore=()=>{if(!SAVED)return;KEEP.forEach(k=>{const e=$(k);if(e&&SAVED[k]!=null)e.value=SAVED[k]});SAVED=null};
const run=f=>async(...a)=>{msg='';isErr=0;snap();try{await f(...a);SAVED=null}catch(e){msg=e;isErr=1}await load();restore()};
const DS={searching:'بانتظار مندوب',assigned:'مندوب في الطريق إليك',heading_pickup:'مندوب في الطريق إليك',picked_up:'تم الاستلام',heading_customer:'في الطريق للعميل',arrived:'وصل للعميل',awaiting_confirmation:'بانتظار تأكيد العميل',completed:'مكتمل',cancelled:'ملغي',disputed:'قيد المراجعة'};const MS={available:'متوفر',unavailable:'غير متوفر',needs_confirmation:'يحتاج تأكيد'};

const offerBox=x=>`<div class="n"><b>طلب مفتوح لكل صيدليات المنطقة</b><br><small>أول صيدلية تقبل تحصل على حجز مؤقت للرد، ويختفي الطلب عن الباقين. اقبل فقط إن كنت ستجهّز التسعيرة.</small><div class="row"><button onclick="rxAccept(${x.id})">قبول الطلب والحجز</button><button class="line" onclick="rxDecline(${x.id})">اعتذار</button></div></div>`;
const claimNote=x=>x.claim_expires_at?`<div class="n"><b>⏱ تم الحجز لصيدليتك — متبقي <span class="cd" data-e="${+x.claim_expires_at}"></span></b><br><small>ينتهي عند ${new Date(x.claim_expires_at*1000).toLocaleTimeString('ar-EG')} — اكتب الأصناف وأرسل التسعيرة قبلها.</small></div>`:'';
const tick=()=>document.querySelectorAll('.cd').forEach(el=>{const s=Math.max(0,+el.dataset.e-Math.floor(Date.now()/1000));el.textContent=s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' دقيقة':'انتهى'});setInterval(tick,1000);
const noForm=x=>!!x.offer_state&&!x.claim_expires_at;
const doneBox=x=>`<div class="n"><small>${x.offer_state==='open'?'':(x.my_status?'تم إرسال ردك لهذا الطلب.':'انتهى حجز هذا الطلب.')}</small>${x.my_status?`<br><small>ردك الحالي: ${esc(MS[x.my_status])}${x.my_price!=null?' — '+esc(x.my_price)+' ج':''}</small><br>${x.my_review=='approved'?'<small>✔ ظهر للعميل</small>':x.my_review=='rejected'?`<small class="e">رفضته الإدارة${x.my_review_reason?': '+esc(x.my_review_reason):''}</small>`:'<small>بانتظار اعتماد الإدارة</small>'}`:''}</div>`;
const replied=x=>!!x.my_status&&!x.claim_expires_at&&x.my_review!=='rejected';
const rxBody=x=>x.offer_state==='open'&&!x.claim_expires_at?offerBox(x):noForm(x)?doneBox(x):replied(x)?doneBox(x)+`<details class="hint"><summary>تعديل ردك</summary>${qform(x)}</details>`:claimNote(x)+qform(x);
const rxSec=p=>{const L=[...p].sort((a,b)=>(b.claim_expires_at?2:b.offer_state==='open'?1:0)-(a.claim_expires_at?2:a.offer_state==='open'?1:0));return `<h2 class="sec" id="s-rx" style="scroll-margin-top:84px">طلبات الروشتات${L.length?' ('+L.length+')':''}</h2>`+(L.map(x=>`<div class="card" id="rxc${x.id}" style="scroll-margin-top:84px">${(x.images&&x.images.length?x.images:[x.file_id]).map(f=>`<img data-im="${+f}" alt="روشتة" title="اضغط للتكبير" onclick="this.style.maxHeight=this.style.maxHeight?'':'${replied(x)?90:220}px'" style="max-width:100%;max-height:${replied(x)?90:220}px;object-fit:contain;cursor:zoom-in;margin-bottom:6px"><br>`).join('')}<small>${esc(x.note)}</small>${rxBody(x)}</div>`).join('')||'<div class="card"><small>لا توجد طلبات روشتات حاليًا.</small></div>')};
window.rxAccept=run(async id=>{const r=await api('/provider/prescriptions/'+id+'/accept',{});msg='تم الحجز لمدة '+r.claim_minutes+' دقائق — أرسل التسعيرة قبل انتهائها';await load();const cd=$('rxc'+id);if(cd)cd.scrollIntoView({block:'start'})});

const qform=x=>`<div><small>${x.requested_items&&x.requested_items.length?'مطلوب استكمال الأصناف الناقصة فقط: '+x.requested_items.map(i=>esc(i.name)+' ×'+esc(i.qty)).join('، '):'اكتب الأصناف المتوفرة عندك فقط مع سعر كل صنف. عدد الأصناف هو مقياس أفضل رد لو الروشتة لم تكتمل.'}</small><div id="qr${x.id}"></div><div class="row"><button class="line" onclick="qadd(${x.id})">+ بند</button></div><details class="hint"><summary>ما الفرق بين «كاملة» و«المتاح فقط»؟</summary><small>«الروشتة كاملة» تعني إنك وفّرت كل أصناف الروشتة دون استبدال أي صنف ببديل إلا بعد موافقة العميل، وبعدها يتقفل البحث. لو في صنف ناقص اختر «تم إرسال المتاح وسيتم توفير الناقص» وهيتعرض الباقي على صيدليات تانية.</small></details><input id="qn${x.id}" placeholder="ملاحظة (اختياري)"><div class="row stk"><button onclick="qsend(${x.id},'full')">الروشتة كاملة ← إرسال</button><button class="line" onclick="qsend(${x.id},'partial')">تم إرسال المتاح وسيتم توفير الناقص</button></div>${x.my_status?`<small>ردك الحالي: ${esc(MS[x.my_status])}${x.my_price!=null?' — '+esc(x.my_price)+' ج':''}</small><br>${x.my_review=='approved'?'<small>✔ اعتمدته الإدارة وظهر للعميل</small>':x.my_review=='rejected'?`<small class="e">رفضته الإدارة${x.my_review_reason?': '+esc(x.my_review_reason):''} — عدّله وأعد الإرسال</small>`:'<small>بانتظار اعتماد الإدارة قبل أن يراه العميل</small>'}`:''}</div>`;
window.qadd=id=>{$('qr'+id).insertAdjacentHTML('beforeend',qrow())};
window.qsend=run(async (id,mode)=>{const rows=[...document.querySelectorAll('#qr'+id+' .qr')].map(r=>({name:r.querySelector('.qn').value.trim(),qty:r.querySelector('.qq').value,unit_price:r.querySelector('.qp').value})).filter(r=>r.name);if(!rows.length)throw 'أضف بندًا واحدًا على الأقل';const r=await api('/provider/prescriptions/'+id+'/quote',{items:rows,send_mode:mode,confirm_all:mode==='full',note:$('qn'+id).value});msg=(mode==='partial'?'تم إرسال المتاح — سيتم توفير الناقص. ':'تم إرسال الروشتة كاملة. ')+'الإجمالي '+r.total+' ج';await load()});
window.qinit=async x=>{if(noForm(x))return;let its=[];try{its=(await api('/provider/prescriptions/'+x.id+'/quote')).items}catch(e){}if(!its.length)its=(x.requested_items&&x.requested_items.length)?x.requested_items.map(i=>({name:i.name,qty:i.qty,item_status:'available'})):[{},{},{}];const el=$('qr'+x.id);if(el)el.innerHTML=its.map(qrow).join('')};
