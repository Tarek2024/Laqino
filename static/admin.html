<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f2a5c"><link rel="icon" href="/assets/icon-192.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="robots" content="noindex, nofollow">
<title>لاقينو — الإدارة</title><style>
:root{--navy:#0f2a5c;--orange:#f28c1b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#f6f8fc;color:#16213a}
header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}header img{width:38px;border-radius:50%}
nav{display:flex;flex-wrap:wrap;gap:2px 0;background:#fff;box-shadow:0 1px 4px #0002}nav button{flex:1 0 auto;background:none;color:var(--navy);border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;margin:0;min-height:44px}nav button.on{border-color:var(--orange);font-weight:700}

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.k{background:#f1f4fb;border-radius:10px;padding:8px;text-align:center;font-size:.85rem}.k b{display:block;font-size:1.1rem;color:var(--navy)}small{color:#667}#err{color:#b00;margin:6px 0}#err.good{color:#0a7a3b;font-weight:700}.phb{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}.phv{width:96px;height:96px;border-radius:18px;overflow:hidden;background:#eef2f8;flex:none;display:grid;place-items:center;border:1px solid #d6deed}.phv img{width:100%;height:100%;object-fit:cover;object-position:center top}.phe{text-align:center;padding:4px;font-size:.72rem;color:#667}.th{width:40px;height:40px;border-radius:10px;object-fit:cover;vertical-align:middle;margin-inline-end:8px;background:#eef2f8}.phc{flex:1 1 180px;min-width:0}.phc input[type=file]{width:100%;max-width:100%;min-width:0;min-height:0}textarea{width:100%;display:block;font:inherit;padding:9px;border-radius:9px;border:1px solid #ccd;margin:3px 0}.ind{margin-inline-start:var(--d)}
.bd{background:#b3261e;color:#fff;border-radius:99px;padding:0 6px;margin-inline-start:4px;font-size:.75rem}.ov{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;background:#fff;color:#16213a;border:1px solid #e1e6f0;margin:0 0 8px;padding:12px;border-radius:12px}.ov b{background:#b3261e;color:#fff;border-radius:99px;padding:1px 10px}[data-home-key] .row label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}[data-home-key]>label{display:block;margin-top:6px;font-size:.9rem;color:#445}[data-home-key]>label input,[data-home-key]>label textarea{width:100%;margin-top:4px}</style><link rel="stylesheet" href="/theme.css"></head><body>
<header><img src="/assets/logo.jpg" alt=""><b>إدارة لاقينو</b><button class="s" id="out" hidden style="margin-inline-start:auto" onclick="logout()">خروج</button></header>
<div id="app"></div><script>
let T=sessionStorage.getItem('at')||'',tab='overview',openF=0,OV=null;const A=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,body)=>{const r=await fetch('/api'+p,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw j.error;return j};
const fail=e=>{const x=document.getElementById('err');x.className='';x.textContent=e};const okm=m=>{const x=document.getElementById('err');x.className='good';x.textContent=m};const dt=t=>new Date(t*1000).toLocaleString('ar-EG');
const TABS={overview:'نظرة عامة',couriers:'المندوبون',topups:'الشحن',listings:'الإعلانات',chats:'بلاغات المحادثات',svcreq:'طلبات الخدمات',products:'منتجات الصيدليات',exchange:'سوق الصيدليات',orders:'الطلبات',users:'المستخدمون',providers:'الصيدليات',rx:'الروشتات',reports:'التقارير',audit:'السجل',regions:'المناطق',cats:'التصنيفات',settings:'العمولة والرسوم',dispatch:'التوزيع والاتصال',doctors:'الأطباء والتخصصات',services:'الخدمات',labs:'المعامل',wa:'تأكيد واتساب',homeui:'الأقسام والواجهة'};
function login(){A.innerHTML='<main><div class="card"><b>دخول الإدارة</b><br><input id="p" placeholder="رقم الهاتف"><input id="w" type="password" placeholder="كلمة المرور"><br><button onclick="doLogin()">دخول</button><div id="err"></div></div></main>'}
async function doLogin(){try{T=(await api('/login',{phone:p.value,password:w.value})).token;const m=await api('/me');if(m.role!='admin'&&m.role!='staff'){T='';throw 'هذا الحساب ليس من الإدارة'}sessionStorage.setItem('at',T);shell()}catch(e){fail(e)}}
function logout(){if(T)api('/logout',{}).catch(()=>{});sessionStorage.removeItem('at');T='';document.getElementById('out').hidden=true;login()}
const pc=k=>{if(!OV)return 0;return OV.items.filter(i=>i.tab==k).reduce((a,i)=>a+(OV.pending[i.key]||0),0)};const bdg=k=>{const n=pc(k);return n?`<span class="bd" aria-label="${n} بانتظار القرار">${esc(n)}</span>`:''};
async function badges(){try{OV=await api('/admin/overview');document.querySelectorAll('nav button[data-k]').forEach(b=>{const k=b.dataset.k;if(k!='overview')b.innerHTML=esc(TABS[k])+bdg(k)})}catch(e){}}
function shell(){document.getElementById('out').hidden=false;A.innerHTML='<nav>'+Object.entries(TABS).map(([k,v])=>`<button data-k="${k}" class="${k==tab?'on':''}" onclick="tab='${k}';shell()">${esc(v)}${k=='overview'?'':bdg(k)}</button>`).join('')+'</nav><main><div id="err"></div><div id="v">جارٍ التحميل…</div></main>';V[tab]().catch(e=>{if(e=='سجّل الدخول أولًا')logout();else fail(e)});if(tab!='overview')badges()}
const MS={available:'متوفر',unavailable:'غير متوفر',needs_confirmation:'يحتاج تأكيد'};const empty=t=>`<div class="card"><small>${t}</small></div>`,v=h=>document.getElementById('v').innerHTML=h;
const act=(path,body,msg)=>async()=>{try{await api(path,body);shell()}catch(e){fail(e)}};
window.sol=async id=>{const p=prompt('رقم هاتف حساب مقدم الخدمة (اتركه فارغًا لفك الربط)');if(p===null)return;go('/admin/service-owners',{provider_id:id,phone:p.trim()})};window.own=ow=>`<details class="card"><summary><b>ربط مقدمي الخدمة بحسابات</b></summary>${ow.length?ow.map(p=>`<div class="row"><span>${esc(p.name_ar)} <small>${p.is_published?'':'(غير منشور) '}${p.owner_phone?'مربوط: '+esc(p.owner_name)+' '+esc(p.owner_phone):'غير مربوط'}${p.rating_count?' — ★'+esc(p.rating_avg)+' ('+esc(p.rating_count)+')':''}</small></span><button class="s" onclick="sol(${p.id})">${p.owner_phone?'تغيير/فك':'ربط'}</button></div>`).join(''):'<small>لا يوجد مقدمو خدمة.</small>'}</details>`;window.svi=async(r,f,b)=>{try{const x=await fetch('/api/service-requests/'+r+'/images/'+f,{headers:{Authorization:'Bearer '+T}});if(!x.ok)throw 'تعذّر تحميل الصورة';const im=document.createElement('img');im.src=URL.createObjectURL(await x.blob());im.alt='صورة الطلب';im.style.cssText='display:block;max-width:100%;max-height:260px;border-radius:8px;margin:6px 0';b.replaceWith(im)}catch(e){fail(e)}};window.qts=qq=>`<details class="card"${qq.length?' open':''}><summary><b>عروض أسعار بانتظار الاعتماد (${qq.length})</b></summary>${qq.length?qq.map(q=>`<div class="card"><b>${esc(q.type)}</b> <small>${esc(q.region_name)} — ${dt(q.created_at)}</small><p>${esc(q.description)}</p><p><small>${q.budget_min||q.budget_max?'ميزانية العميل: '+esc(q.budget_min||'؟')+' – '+esc(q.budget_max||'؟')+' ج — ':''}المقدم: ${esc(q.provider_name)}${q.rating_count?' ★'+esc(q.rating_avg)+' ('+esc(q.rating_count)+')':''}</small></p><p><b>السعر: ${esc(q.price)} ج</b>${q.note?' <small>— '+esc(q.note)+'</small>':''}</p><div class="row"><button class="s" onclick="sqd(${q.id},'approve')">اعتماد</button><button class="r" onclick="sqd(${q.id},'reject')">رفض</button></div></div>`).join(''):'<small>لا توجد عروض بانتظار الاعتماد.</small>'}</details>`;window.rrs=rr=>`<details class="card"${rr.length?' open':''}><summary><b>بلاغات على تقييمات (${rr.length})</b></summary>${rr.length?rr.map(x=>`<div class="card"><b>${esc(x.provider_name)}</b> <small>${dt(x.created_at)} — بلّغ: ${esc(x.reporter_name)} — العميل: ${esc(x.customer_name||'—')}</small><p>${'★'.repeat(x.stars)}${x.comment?' — '+esc(x.comment):''}</p>${x.rating_exists&&(x.current_stars!=x.stars||x.current_comment!=x.comment)?`<p><small>بعد التعديل: ${'★'.repeat(x.current_stars)}${x.current_comment?' — '+esc(x.current_comment):''}</small></p>`:''}<p><small>سبب البلاغ: ${esc(x.reason)}</small></p>${x.rating_exists?`<div class="row"><button class="r" onclick="rrd(${x.id},'hide')">إخفاء التقييم</button><button class="s" onclick="rrd(${x.id},'dismiss')">رفض البلاغ</button></div>`:'<small>العميل حذف التقييم.</small>'}</div>`).join(''):'<small>لا توجد بلاغات على تقييمات.</small>'}</details>`;window.rrd=async(id,a)=>{const n=prompt(a=='hide'?'سبب الإخفاء (إلزامي، يصل للعميل والمقدم)':'سبب رفض البلاغ (إلزامي، يصل للمقدم)');if(n===null)return;go('/admin/service-rating-reports/'+id,{action:a,note:n})};window.sqd=async(id,a)=>{let n='';if(a=='reject'){n=prompt('سبب الرفض (إلزامي، يظهر للمقدم)');if(n===null)return}go('/admin/service-quotes/'+id,{action:a,note:n})};window.sdr=async(id,st)=>{const n=prompt('سبب القرار (5 حروف على الأقل، يُرسل للطرفين)');if(n===null)return;go('/admin/service-requests/'+id,{status:st,note:n})};window.svn=async(id,st)=>{const n=st=='in_progress'?'':(prompt('ملاحظة للعميل (اختياري)')||'');go('/admin/service-requests/'+id,{status:st,note:n})};window.vc=async tid=>{try{const r=await api('/admin/chats/'+tid);document.getElementById('cv'+tid).innerHTML=`<div class="card"><small>${esc(r.buyer)} (مشترٍ) / ${esc(r.seller)} (بائع)</small>`+(r.messages.map(m=>`<p><b>${m.from=='buyer'?esc(r.buyer):esc(r.seller)}:</b> ${esc(m.body)} ${m.image?`<button class="s" onclick="vci(${+r.thread_id},${+m.id},this)">عرض الصورة</button>`:''} <small>${dt(m.created_at)}</small></p>`).join('')||'<small>لا رسائل.</small>')+'</div>'}catch(e){fail(e)}};window.vci=async(tid,mid,b)=>{try{const r=await fetch('/api/admin/chats/'+tid+'/images/'+mid,{headers:{Authorization:'Bearer '+T}});if(!r.ok)throw 'تعذّر تحميل الصورة';const u=URL.createObjectURL(await r.blob());const im=document.createElement('img');im.src=u;im.alt='صورة';im.style.cssText='display:block;max-width:100%;max-height:260px;border-radius:8px;margin:6px 0';b.replaceWith(im)}catch(e){fail(e)}};window.rc=async id=>{if(!confirm('أصدر الكود فقط بعد التحقق من هوية صاحب الحساب. متابعة؟'))return;try{const r=await api('/admin/users/'+id+'/reset-code',{});alert('كود الاستعادة: '+r.code+'\nالهاتف: '+r.phone+'\nصالح 30 دقيقة ولن يظهر مرة أخرى. أعطه لصاحب الحساب فقط.')}catch(e){alert(e)}};
const SG0={review:'قيد مراجعة الإدارة',at_pharmacies:'عند الصيدليات',quoted:'وصلت ردود',completed:'اكتملت',closed:'مغلقة'};
const RXPS={received:'استلمت',reserved:'حاجزة الطلب',replied:'ردّت',declined:'اعتذرت',offered:'معروض عليها',claim_expired:'انتهى الحجز بلا رد',taken:'قبلتها صيدلية أخرى',offer_expired:'انتهى العرض'};
const RXSS={searching:'جاري البحث',awaiting_partial_approval:'رد بانتظار الاعتماد',ended_partial:'انتهى — أفضل رد جزئي',partial_accepted:'العميل قبل رد جزئي',ended_none:'انتهى بلا رد',complete:'اكتمل',not_enabled:'بحث تلقائي غير مفعّل'};
let RXM={before:null};
const rxMonCard=x=>`<div class="card"><b>روشتة #${x.id}${x.parent_id?' (بحث نواقص للروشتة #'+x.parent_id+')':''}</b> <small>${esc(x.customer)} — ${esc(x.region_name)} — ${dt(x.created_at)}</small><br><small>المرحلة: ${esc(SG0[x.stage]||x.stage)} — البحث: <b>${esc(RXSS[x.search_state]||x.search_state)}</b></small>${x.pharmacies.map(p=>`<p><b>${esc(p.pharmacy)}</b>: ${esc(RXPS[p.state]||p.state)}${p.state=='reserved'?' حتى '+dt(p.reserved_until):''}${p.state=='replied'?' ('+esc(MS[p.status]||p.status)+(p.price!=null?' — '+esc(p.price)+' ج':'')+')':''}${p.seen_at?' — اطّلعت':''}</p>`).join('')||'<small>لم تُعرض على صيدليات بعد.</small>'}${x.missing_items.length?'<p><small>النواقص: '+x.missing_items.map(i=>esc(i.name)+' ×'+esc(i.qty)).join('، ')+'</small></p>':''}${x.missing_searches.map(k=>`<p><small>بحث نواقص #${k.id}: ${esc(RXSS[k.search_state]||k.search_state)} — ${k.replies} رد — ${k.items.map(i=>esc(i.name)).join('، ')}</small></p>`).join('')}</div>`;
window.rxMonLoad=async reset=>{try{if(reset)RXM.before=null;const st=document.getElementById('rxmf')?.value||'all';const r=await api('/admin/rx/monitor?status='+st+(RXM.before?'&before='+RXM.before:''));const box=document.getElementById('rxmon');if(!box)return;const h=r.items.map(rxMonCard).join('');if(reset)box.innerHTML=h||empty('لا توجد روشتات.');else box.insertAdjacentHTML('beforeend',h);RXM.before=r.next_before;document.getElementById('rxmore').innerHTML=r.has_more?'<button class="s" onclick="rxMonLoad(0)">تحميل المزيد</button>':''}catch(e){fail(e)}};
window.rxMonInit=async()=>{rxMonLoad(1);try{const m=await api('/admin/rx/manual-review');const b=document.getElementById('rxmr');if(b)b.checked=!!m.enabled}catch(e){}};
window.rxManualReview=async el=>{try{await api('/admin/rx/manual-review',{enabled:el.checked});okm(el.checked?'تم تفعيل الاعتماد اليدوي':'تم إيقاف الاعتماد اليدوي (الردود تظهر للعميل فور وصولها)')}catch(e){el.checked=!el.checked;fail(e)}};
window.go=async(path,body)=>{try{await api(path,body);shell()}catch(e){fail(e)}};
window.wac=(ph,pu)=>go('/admin/verifications/confirm',{phone:ph,purpose:pu,code:document.getElementById('wc'+ph+pu).value});
window.cp=id=>{const r=prompt('سبب الإكمال الإداري؟');if(r&&r.trim().length>=3)go('/admin/orders/'+id+'/complete',{reason:r.trim()})};window.rv=id=>{const r=prompt('سبب عكس العمولة؟');if(r&&r.trim().length>=3&&confirm('سيُعاد مبلغ العمولة لمحفظة المندوب مرة واحدة. متابعة؟'))go('/admin/orders/'+id+'/reverse-commission',{reason:r.trim()})};window.rej=(path)=>{const r=prompt('سبب الرفض؟');if(r)go(path,{status:'rejected',reason:r})};
window.xtd=id=>{const r=prompt('سبب إيقاف الإعلان؟');if(r&&r.trim())go('/admin/exchange/'+id+'/takedown',{reason:r.trim()})};
window.sc=async()=>{try{const r=await api('/admin/products/seed-categories',{});okm('تم إنشاء '+r.created+' تصنيف')}catch(e){fail(e)}};
const V={

window.cw=async id=>{const b=document.getElementById('cw'+id);if(!b)return;if(b.innerHTML){b.innerHTML='';return}try{const w=await api('/admin/couriers/'+id+'/wallet'),K={topup:'شحن',commission:'عمولة',reversal:'استرداد',adjustment:'تعديل إداري'},S={pending:'قيد المراجعة',approved:'مقبول',rejected:'مرفوض'};
b.innerHTML=`<div class="g"><div class="k"><b>${esc(w.balance)} ج</b>الرصيد</div><div class="k"><b>${esc(w.held)} ج</b>محجوز لطلبات جارية</div><div class="k"><b>${esc(w.available_balance)} ج</b>المتاح</div></div><div class="row"><input id="wa${id}" type="number" step="0.01" placeholder="المبلغ (+ إضافة / − خصم)" style="width:9em"><input id="wr${id}" placeholder="السبب (مطلوب)" style="flex:1"><button onclick="cwa(${id})">تنفيذ التعديل</button></div><p><b>الحركات</b></p>`+(w.entries.length?w.entries.map(e=>`<p>${esc(K[e.kind]||e.kind)}: <b style="color:${e.amount>=0?'#0a7a3b':'#b3261e'}">${e.amount>0?'+':''}${esc(e.amount)} ج</b> <small>${e.kind=='adjustment'?esc(e.reason||''):esc(e.ref_type)+' #'+esc(e.ref_id)} — ${dt(e.created_at)}</small></p>`).join(''):'<small>لا توجد حركات.</small>')+'<p><b>طلبات الشحن</b></p>'+(w.topups.length?w.topups.map(t=>`<p>${esc(t.amount)} ج — ${esc(S[t.status]||t.status)}${t.reason?' ('+esc(t.reason)+')':''} <small>${esc(t.transfer_ref)} — ${dt(t.created_at)}</small></p>`).join(''):'<small>لا توجد طلبات.</small>')}catch(e){fail(e)}};
window.cwa=async id=>{const am=parseFloat(document.getElementById('wa'+id).value),rs=document.getElementById('wr'+id).value.trim();if(!am||rs.length<3)return alert('أدخل مبلغًا غير صفري وسببًا (3 أحرف على الأقل)');if(!confirm((am>0?'إضافة ':'خصم ')+Math.abs(am)+' ج '+(am>0?'إلى':'من')+' رصيد المندوب؟\nالسبب: '+rs))return;try{await api('/admin/couriers/'+id+'/wallet-adjust',{amount:am,reason:rs,request_key:Date.now()+'-'+Math.random().toString(36).slice(2,10)});document.getElementById('cw'+id).innerHTML='';cw(id)}catch(e){alert(e)}};

V.doctors=async()=>{const[sp,dl,ro]=await Promise.all([api('/specialties?all=1'),api('/admin/doctors'),regionOpts(EDD&&EDD.region_id)]);const d=EDD||{};
v(`<div class="card"><b>التخصصات</b>${sp.map(x=>`<p>${esc(x.name_ar)} <small>(${x.published} منشور)</small> <button class="s" onclick="go('/admin/specialties/${x.id}',{is_active:${x.is_active?'false':'true'}})">${x.is_active?'إخفاء':'تفعيل'}</button></p>`).join('')||'<small>لا توجد تخصصات.</small>'}<input id="sn" placeholder="تخصص جديد"><button onclick="go('/admin/specialties',{name_ar:sn.value})">إضافة تخصص</button></div>
<div class="card"><b>${d.id?'تعديل طبيب #'+d.id:'إضافة طبيب'}</b><small> (يُحفظ غير منشور حتى تنشره)</small>${phBlock('d',d)}<input id="dn" placeholder="اسم الطبيب" value="${esc(d.name_ar||'')}"><select id="dsp">${sp.map(x=>`<option value="${x.id}"${d.specialty_id==x.id?' selected':''}>${esc(x.name_ar)}</option>`).join('')}</select><select id="drg">${ro}</select><input id="dcl" placeholder="اسم العيادة" value="${esc(d.clinic_name||'')}"><input id="dad" placeholder="العنوان" value="${esc(d.address||'')}"><input id="dsc" placeholder="المواعيد" value="${esc(d.schedule||'')}"><input id="dph" placeholder="هاتف العيادة" value="${esc(d.phone||'')}"><input id="dwa" placeholder="واتساب" value="${esc(d.whatsapp||'')}"><textarea id="dbi" placeholder="نبذة (اختياري)">${esc(d.bio||'')}</textarea><button onclick="sd(${d.id||0})">${d.id?'حفظ التعديل':'إضافة'}</button>${d.id?' <button class="s" onclick="EDD=null;shell()">إلغاء</button>':''}</div>
<div class="card"><b>الأطباء</b>${dl.length?dl.map(x=>`<p>${x.photo_file_id?`<img class="th" data-fid="${x.photo_file_id}" alt="">`:''}<b>${esc(x.name_ar)}</b> — ${esc(x.specialty)} — ${esc(x.region_name)} <small>${x.is_published?'منشور':'غير منشور'}</small><br><button class="s" onclick="ed(${x.id})">تعديل</button> <button onclick="go('/admin/doctors/${x.id}/publish',{published:${x.is_published?'false':'true'}})">${x.is_published?'إخفاء':'نشر'}</button></p>`).join(''):'<small>لا يوجد أطباء.</small>'}</div>`);phInit('d',EDD)};
window.sd=async id=>{const g=i=>document.getElementById(i).value,b={name_ar:g('dn'),specialty_id:+g('dsp'),region_id:+g('drg'),clinic_name:g('dcl'),address:g('dad'),schedule:g('dsc'),phone:g('dph'),whatsapp:g('dwa'),bio:g('dbi')};try{const f=await phSend('d');if(f!==undefined)b.photo_file_id=f;await api(id?'/admin/doctors/'+id:'/admin/doctors',b);EDD=null;shell();okm(id?'تم حفظ بيانات الطبيب بنجاح.':'تمت إضافة الطبيب بنجاح، وهو غير منشور حتى تضغط «نشر».')}catch(e){await phUndo('d');fail(e)}};
window.ed=async id=>{try{EDD=(await api('/admin/doctors')).find(x=>x.id==id);shell()}catch(e){fail(e)}};
V.services=async()=>{const[ty,sl,ro]=await Promise.all([api('/service-types?all=1'),api('/admin/services'),regionOpts(ESV&&ESV.region_id)]);const d=ESV||{};
v(`<div class="card"><b>أنواع الخدمات</b>${ty.map(x=>`<p>${esc(x.name_ar)} <small>(${x.published} منشور)</small> <button class="s" onclick="go('/admin/service-types/${x.id}',{is_active:${x.is_active?'false':'true'}})">${x.is_active?'إخفاء':'تفعيل'}</button></p>`).join('')||'<small>لا توجد أنواع. أضف نوعًا لتبدأ.</small>'}<input id="stn" placeholder="نوع خدمة جديد"><button onclick="go('/admin/service-types',{name_ar:document.getElementById('stn').value})">إضافة نوع</button></div>
<div class="card"><b>${d.id?'تعديل مقدّم خدمة #'+d.id:'إضافة مقدّم خدمة'}</b><small> (يُحفظ غير منشور حتى تنشره، والنشر يتطلب هاتفًا أو واتساب)</small><input id="svn" placeholder="الاسم" value="${esc(d.name_ar||'')}"><select id="svt">${ty.map(x=>`<option value="${x.id}"${d.type_id==x.id?' selected':''}>${esc(x.name_ar)}</option>`).join('')}</select><select id="svr">${ro}</select><textarea id="svd" placeholder="وصف الخدمة">${esc(d.description||'')}</textarea><input id="sva" placeholder="العنوان (اختياري)" value="${esc(d.address||'')}"><input id="svp" placeholder="هاتف" value="${esc(d.phone||'')}"><input id="svw" placeholder="واتساب" value="${esc(d.whatsapp||'')}"><button onclick="ss(${d.id||0})">${d.id?'حفظ التعديل':'إضافة'}</button>${d.id?' <button class="s" onclick="ESV=null;shell()">إلغاء</button>':''}</div>
<div class="card"><b>مقدّمو الخدمة</b>${sl.length?sl.map(x=>`<p><b>${esc(x.name_ar)}</b> — ${esc(x.type)} — ${esc(x.region_name)} <small>${x.is_published?'منشور':'غير منشور'}</small><br><button class="s" onclick="es(${x.id})">تعديل</button> <button onclick="go('/admin/services/${x.id}/publish',{published:${x.is_published?'false':'true'}})">${x.is_published?'إخفاء':'نشر'}</button></p>`).join(''):'<small>لا يوجد مقدّمو خدمة.</small>'}</div>`)};
window.ss=async id=>{const g=i=>document.getElementById(i).value,b={name_ar:g('svn'),type_id:+g('svt'),region_id:+g('svr'),description:g('svd'),address:g('sva'),phone:g('svp'),whatsapp:g('svw')};try{await api(id?'/admin/services/'+id:'/admin/services',b);ESV=null;shell()}catch(e){fail(e)}};
window.es=async id=>{try{ESV=(await api('/admin/services')).find(x=>x.id==id);shell()}catch(e){fail(e)}};
V.labs=async()=>{const[ll,ro]=await Promise.all([api('/admin/labs'),regionOpts(ELB&&ELB.region_id)]);const d=ELB||{};
v(`<div class="card"><b>${d.id?'تعديل معمل #'+d.id:'إضافة معمل'}</b><small> (يُحفظ غير منشور حتى تنشره، والنشر يتطلب العنوان وهاتفًا أو واتساب)</small>${phBlock('l',d)}<input id="lbn" placeholder="اسم المعمل" value="${esc(d.name_ar||'')}"><select id="lbr">${ro}</select><input id="lba" placeholder="العنوان" value="${esc(d.address||'')}"><input id="lbh" placeholder="المواعيد" value="${esc(d.hours||'')}"><textarea id="lbt" placeholder="التحاليل المتاحة (نص حر يُبحث فيه)">${esc(d.tests||'')}</textarea><label><input type="checkbox" id="lbv" style="width:auto"${d.home_visit?' checked':''}> يقدّم سحب عينات منزلي</label><input id="lbp" placeholder="هاتف" value="${esc(d.phone||'')}"><input id="lbw" placeholder="واتساب" value="${esc(d.whatsapp||'')}"><button onclick="sl(${d.id||0})">${d.id?'حفظ التعديل':'إضافة'}</button>${d.id?' <button class="s" onclick="ELB=null;shell()">إلغاء</button>':''}</div>
<div class="card"><b>المعامل</b>${ll.length?ll.map(x=>`<p>${x.photo_file_id?`<img class="th" data-fid="${x.photo_file_id}" alt="">`:''}<b>${esc(x.name_ar)}</b> — ${esc(x.region_name)} <small>${x.is_published?'منشور':'غير منشور'}</small><br><button class="s" onclick="el(${x.id})">تعديل</button> <button onclick="go('/admin/labs/${x.id}/publish',{published:${x.is_published?'false':'true'}})">${x.is_published?'إخفاء':'نشر'}</button></p>`).join(''):'<small>لا يوجد معامل.</small>'}</div>`);phInit('l',ELB)};
window.sl=async id=>{const g=i=>document.getElementById(i).value,b={name_ar:g('lbn'),region_id:+g('lbr'),address:g('lba'),hours:g('lbh'),tests:g('lbt'),home_visit:document.getElementById('lbv').checked,phone:g('lbp'),whatsapp:g('lbw')};try{const f=await phSend('l');if(f!==undefined)b.photo_file_id=f;await api(id?'/admin/labs/'+id:'/admin/labs',b);ELB=null;shell();okm(id?'تم حفظ بيانات المعمل بنجاح.':'تمت إضافة المعمل بنجاح، وهو غير منشور حتى تضغط «نشر».')}catch(e){await phUndo('l');fail(e)}};
window.el=async id=>{try{ELB=(await api('/admin/labs')).find(x=>x.id==id);shell()}catch(e){fail(e)}};
</script><script>
/* ---- المرحلة 23: استيراد الأطباء والمعامل من Excel (بطاقة تُلحق أسفل تبويبي «الأطباء» و«المعامل»؛ لا تغيير في أي كود قائم) ---- */
let IMP={b64:'',name:'',pv:null};
const impOne=(i)=>`<tr class="im-${esc(i.status)}"><td>${esc(i.kind=='doctors'?'طبيب':'معمل')} ${esc(i.row)}</td><td>${esc(i.name)}${i.specialty?' <small>'+esc(i.specialty)+'</small>':''}${i.region?' <small>— '+esc(i.region)+'</small>':''}</td><td>${({new:'جديد',update:'تحديث',duplicate:'مكرر',error:'خطأ'})[i.status]||esc(i.status)}</td><td><small>${esc(i.msg)}${(i.warn||[]).map(w=>' ⚠ '+esc(w)).join('')}</small></td></tr>`;
const impCount=(o)=>`جديد ${esc(o.new)} · تحديث ${esc(o.update)} · مكرر ${esc(o.duplicate)} · أخطاء ${esc(o.error)}`;
function impBody(){const r=IMP.pv;if(!r)return '';const s=r.summary,can=s.doctors.new+s.doctors.update+s.labs.new+s.labs.update>0;
return `<div class="card" style="background:#f8fafd"><b>${r.done?'تم الاستيراد':'نتيجة المعاينة'}: ${esc(IMP.name)}</b>
<p>الأطباء: ${impCount(s.doctors)}<br>المعامل: ${impCount(s.labs)}</p>
${r.new_specialties.length?`<p><small>تخصصات ستُنشأ تلقائيًا: ${r.new_specialties.map(esc).join('، ')}</small></p>`:''}
${r.notes.map(n=>`<p><small>ℹ ${esc(n)}</small></p>`).join('')}
${r.done?`<p class="good" style="color:#0a7a3b;font-weight:700">أُضيف ${esc(r.done.doctors)} طبيب و${esc(r.done.labs)} معمل${r.done.updated?'، وتحديث '+esc(r.done.updated):''}${r.done.specialties?'، وتخصصات جديدة '+esc(r.done.specialties):''}${r.done.published?'، ونُشر '+esc(r.done.published):'. كلها غير منشورة، راجعها ثم انشرها'}.</p>`:''}
<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:.85rem"><tbody>${r.items.map(impOne).join('')}</tbody></table></div>
${r.truncated?'<small>عُرض جزء من الصفوف (الأخطاء أولًا).</small>':''}
${!r.done&&can?'<button id="impgo" onclick="impCommit()">تأكيد الاستيراد</button>':''}${!r.done&&!can?'<p><small>لا يوجد ما يُستورد. صحّح الأخطاء ثم ارفع الملف من جديد.</small></p>':''}</div>`}
const impOpts=()=>({data:IMP.b64,default_region_id:document.getElementById('imreg').value||null,update_existing:document.getElementById('imupd').checked,publish:document.getElementById('impub').checked});
window.impTpl=async()=>{try{const t=await api('/admin/import/template');const a=document.createElement('a');a.href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+t.data;a.download=t.name;document.body.appendChild(a);a.click();a.remove()}catch(e){fail(e)}};
window.impPick=async inp=>{const f=inp.files[0];if(!f)return;if(!/\.xlsx$/i.test(f.name))return fail('اختر ملف Excel بصيغة xlsx (احفظه من Excel كـ «مصنف Excel»).');if(f.size>5e6)return fail('الملف كبير (الحد 5 ميجابايت).');
try{fail('');IMP.b64=await b64(f);IMP.name=f.name;IMP.pv=null;document.getElementById('imres').innerHTML='<small>جارٍ فحص الملف…</small>';await impPreview()}catch(e){document.getElementById('imres').innerHTML='';fail(e)}};
window.impPreview=async()=>{if(!IMP.b64)return fail('اختر ملف Excel أولًا.');try{fail('');IMP.pv=await api('/admin/import/preview',impOpts());document.getElementById('imres').innerHTML=impBody()}catch(e){document.getElementById('imres').innerHTML='';fail(e)}};
window.impCommit=async()=>{const b=document.getElementById('impgo');if(b)b.disabled=true;try{fail('');IMP.pv=await api('/admin/import/commit',impOpts());IMP.b64='';document.getElementById('imres').innerHTML=impBody();okm('تم الاستيراد بنجاح.')}catch(e){if(b)b.disabled=false;fail(e)}};
async function impMount(){const v0=document.getElementById('v');if(!v0)return;let ro='';try{ro=await regionOpts()}catch(e){}
v0.insertAdjacentHTML('beforeend',`<div class="card" id="impcard"><b>استيراد من ملف Excel (أطباء ومعامل)</b><small> — صفحة «الأطباء» وصفحة «المعامل» في ملف واحد. التخصصات الناقصة تُنشأ تلقائيًا، وكل جديد يُحفظ غير منشور حتى تراجعه.</small>
<div class="row"><button class="s" onclick="impTpl()">تنزيل نموذج Excel</button></div>
<label>ملف Excel (.xlsx)<br><input type="file" id="imf" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="impPick(this)"></label>
<label>منطقة افتراضية للصفوف التي بلا منطقة<br><select id="imreg" onchange="IMP.b64&&impPreview()"><option value="">بدون</option>${ro}</select></label>
<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="imupd" style="width:auto" onchange="IMP.b64&&impPreview()"> تحديث الموجود (يملأ الخلايا غير الفارغة فقط، ولا يمسح شيئًا)</label>
<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="impub" style="width:auto"> نشر الجديد المكتمل مباشرة (وإلا يبقى غير منشور)</label>
<div id="imres"></div></div>`)}
for(const k of ['doctors','labs']){const o=V[k];V[k]=async()=>{await o();await impMount()}}
</script>
<script src="/pdelivery-admin.js"></script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script><script src="/notif.js" defer></script></body></html>
