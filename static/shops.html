<header class="ph"><div class="in"><a class="back" href="/" aria-label="رجوع للتطبيق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>رجوع للتطبيق</span></a><div class="tt"><img class="lg" src="/assets/logo.jpg" alt=""><h1>محلات في منطقتك</h1></div><div class="ph-end" id="ph-end"></div></div></header><main id="m"></main><script src="/notif.js" defer></script><script>
/* المرحلة 70 (م5 المحلات): واجهة العميل = أنواع + محلات المنطقة + أصناف المحل بصور + طلب (لو مفعّل). كل نص من الخادم يمر عبر esc. */
const T=localStorage.getItem('t'),R=+localStorage.getItem('rg')||0,m=document.getElementById('m'),$=i=>document.getElementById(i);

/* كارت المحل: غلاف + لوجو + اسم + نوع + مفتوح/مغلق (الغلاف يرجع لأول صورة صنف لو المحل مارفعش غلاف) */
const shopCard=s=>(SHT[s.id]=s.type_id,`<button class="card sc shc" onclick="sopen(${s.id})"><div class="cv">${cvTag(s.id,s.cover_file_id,tyIcon(s.type_id))}</div><div class="lgw">${lgTag(s.id,s.logo_file_id,tyIcon(s.type_id))}</div><div class="sb"><b>${esc(s.name_ar)}</b> <small>${esc(s.type_name)}</small><br><small>${esc(s.region_name)}${s.address?' — '+esc(s.address):''}</small><br>${badge(s.is_open)} <small>· ${+s.item_count} صنف</small></div></button>`);

const shopApplyCard=()=>`<section class="card shop-apply" id="shop-apply"><h3>عندك محل؟</h3><p>انضم إلى محلات لاقينو وعرّف العملاء على منتجاتك وخدماتك.</p><button type="button" class="full" onclick="shopApplyToggle()">قدّم كمحل</button><div id="shop-apply-form" hidden></div></section>`;
window.shopApplyToggle=async()=>{const box=$('shop-apply-form');if(!box)return;if(box.hidden===false){box.hidden=true;return}if(!T){box.hidden=false;box.innerHTML='<p class="n">سجّل الدخول أولًا، وبعدها قدّم بيانات محلك.</p><a class="full" href="/?next=%2Fshops.html">تسجيل الدخول</a>';return}box.hidden=false;box.innerHTML='<p class="n">جاري تحميل بيانات التسجيل…</p>';try{const [rr,tt]=await Promise.all([api('/regions?parent_id=1'),api('/shop-types')]);if(!tt.enabled)throw new Error('تسجيل المحلات غير مفعّل حاليًا');const regs=rr||[];if(R&&!regs.some(x=>+x.id===R))regs.unshift({id:R,name_ar:localStorage.getItem('rgn')||'منطقتي'});box.innerHTML=`<form id="shop-apply-form-inner" onsubmit="shopApplySubmit(event)"><label>نوع المحل</label><select name="type_id" required><option value="">اختر النوع</option>${tt.items.map(x=>`<option value="${+x.id}">${esc(x.name_ar)}</option>`).join('')}</select><label>المنطقة</label><select name="region_id" required><option value="">اختر المنطقة</option>${regs.map(x=>`<option value="${+x.id}" ${+x.id===R?'selected':''}>${esc(x.name_ar)}</option>`).join('')}</select><label>اسم المحل</label><input name="name_ar" required minlength="3" maxlength="80" placeholder="اسم المحل"><label>العنوان بالتفصيل</label><input name="address" required minlength="3" maxlength="200" placeholder="الشارع والمنطقة"><label>رقم الهاتف</label><input name="phone" required inputmode="tel" placeholder="01xxxxxxxxx"><button class="full" type="submit">إرسال طلب الانضمام</button><p class="n">طلبك هيوصل للإدارة للمراجعة، والمحل هيظهر للعملاء بعد الموافقة.</p></form>`}catch(e){box.innerHTML=`<p class="e">${esc(e.message||e)}</p>`}};
window.shopApplySubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=form.querySelector('button[type="submit"]');if(!form||!b)return;b.disabled=true;try{const d=Object.fromEntries(new FormData(form).entries());d.type_id=+d.type_id;d.region_id=+d.region_id;const r=await api('/shops/apply',d);form.innerHTML=`<p class="okm"><b>تم إرسال طلبك بنجاح ✓</b></p><p>رقم الطلب #${esc(r.id)} — طلبك قيد مراجعة الإدارة.</p>`; }catch(err){alert(err.message||'تعذّر إرسال الطلب');b.disabled=false}};
async function list(){
 try{const t=await api('/shop-types');if(!t.enabled){m.innerHTML='<div class="card"><b>قسم المحلات غير متاح حاليًا.</b><br><small>هيظهر هنا أول ما يتفعّل في منطقتك.</small></div>';return}TYPES=t.items;
 const qs=[];if(R&&!ALL)qs.push('region_id='+R);if(TY)qs.push('type_id='+TY);if(Q.trim())qs.push('q='+encodeURIComponent(Q.trim()));
 const l=await api('/shops'+(qs.length?'?'+qs.join('&'):''));
 const act=document.activeElement&&document.activeElement.id=='sqi';
 m.innerHTML=`<input id="sqi" value="${esc(Q)}" placeholder="ابحث باسم المحل" aria-label="بحث" oninput="sq(this.value)"><div class="chips" role="group" aria-label="نوع المحل"><button class="${TY?'':'on'}" onclick="sty(0)">الكل</button>${TYPES.map(x=>`<button class="${TY==x.id?'on':''}" onclick="sty(${x.id})">${esc(x.name_ar)}</button>`).join('')}</div>`
  +(R?`<label class="n"><input type="checkbox" ${ALL?'checked':''} onchange="sall(this.checked)"> كل المناطق</label>`:'<p class="n">اختار منطقتك من <a href="/">الصفحة الرئيسية</a> عشان تشوف محلات منطقتك.</p>')
  +(l.items.length?l.items.map(shopCard).join(''):'<div class="card"><small>لا توجد محلات مطابقة حاليًا.</small></div>')+shopApplyCard();
 if(act){const e=$('sqi');e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
 catch(e){m.innerHTML=`<div class="card"><p class="e">${esc(e&&e.message?e.message:e)}</p></div>`}}
const total=()=>money(Object.values(CART).reduce((a,x)=>a+x.p*x.q,0));
window.ISET={};
const itemRow=(x,can)=>{const ids=x.image_ids||[],ic=tyIcon(SHT[SID]);ISET[x.id]=ids;return `<div class="gi" id="it${x.id}">${ids.length?`<button class="zb" aria-label="تكبير صورة ${esc(x.name_ar)}" onclick="zoom(${x.id},0)">${imgTag(SID,ids[0],'',ic)}${ids.length>1?`<span class="more">+${ids.length-1}</span>`:''}</button>`:`<div class="zb" style="cursor:default">${phTag('',ic)}</div>`}<div class="gb"><b>${esc(x.name_ar)}</b><span class="pr">${esc(money(x.price))} ج</span>${x.description?`<small>${esc(x.description)}</small>`:''}${can?`<div class="row"><button class="line" aria-label="أقل" onclick="cq(${x.id},-1)">−</button><b id="q${x.id}">${CART[x.id]?CART[x.id].q:0}</b><button class="line" aria-label="أكثر" onclick="cq(${x.id},1)">＋</button></div>`:''}</div></div>`};
/* المعاينة المكبّرة: كل صور الصنف، تمرير بالسحب أو الأسهم، إغلاق بالزر أو الخلفية أو Esc */
let LB=null;
const lbDraw=()=>{const l=LB;if(!l)return;const f=l.ids[l.i],ic=tyIcon(SHT[SID]);$('lbs').innerHTML=imgTag(SID,f,'',ic).replace('loading="lazy"','');$('lbc').textContent=(l.i+1)+' / '+l.ids.length;[...document.querySelectorAll('#lb .th button')].forEach((b,k)=>b.className=k==l.i?'on':'')};
window.lbgo=d=>{if(!LB)return;LB.i=(LB.i+d+LB.ids.length)%LB.ids.length;lbDraw()};
window.lbset=i=>{if(LB){LB.i=i;lbDraw()}};
window.lbclose=()=>{const e=$('lb');if(e)e.remove();document.body.style.overflow=LB?LB.ov:'';document.removeEventListener('keydown',lbkey);if(LB&&LB.back&&LB.back.focus)LB.back.focus();LB=null};

window.zoom=(id,i)=>{const ids=ISET[id]||[];if(!ids.length)return;LB={ids,i:i||0,ov:document.body.style.overflow,back:document.activeElement};
 const many=ids.length>1,ic=tyIcon(SHT[SID]),d=document.createElement('div');d.id='lb';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','صور الصنف');
 d.innerHTML=`<span class="lc" id="lbc" aria-live="polite"></span><button class="lx" aria-label="إغلاق" onclick="lbclose()">✕</button><div class="st" id="lbs"></div>${many?`<button class="ln" aria-label="التالية" onclick="lbgo(1)">‹</button><button class="lp" aria-label="السابقة" onclick="lbgo(-1)">›</button><div class="th">${ids.map((f,k)=>`<button aria-label="صورة ${k+1}" onclick="lbset(${k})">${imgTag(SID,f,'',ic)}</button>`).join('')}</div>`:''}`;
 d.addEventListener('click',e=>{if(e.target===d||e.target.id=='lbs')lbclose()});let x0=null;d.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});d.addEventListener('touchend',e=>{if(x0===null||!many)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>45)lbgo(dx<0?1:-1)},{passive:true});
 document.body.appendChild(d);document.body.style.overflow='hidden';document.addEventListener('keydown',lbkey);lbDraw();d.querySelector('.lx').focus()};
window.cq=(id,d)=>{const x=window.MENU.items.find(i=>i.id==id);if(!x)return;const q=Math.max(0,Math.min(50,((CART[id]||{q:0}).q)+d));if(q)CART[id]={p:x.price,q};else delete CART[id];$('q'+id).textContent=q;const t=$('ct');if(t)t.textContent=total()+' ج';const b=$('ob');if(b)b.disabled=!Object.keys(CART).length};
async function menu(){
 try{const [d,pf]=await Promise.all([api('/shops/'+SID+'/menu'),api('/shops/'+SID+'/profile').catch(()=>null)]);window.MENU=d;if(!d.enabled||!d.shop){m.innerHTML='<div class="card"><p class="e">المحل غير متاح.</p></div>';return}
 const s=d.shop,can=d.order_enabled&&s.is_open&&!!T,pi=pf||{},ic=tyIcon(SHT[SID]||s.type_id)||pi.type_icon||'🛍️';SHT[SID]=SHT[SID]||s.type_id;
 m.innerHTML=`<button class="line" onclick="sback()">‹ كل المحلات</button><div class="hero"><div class="cv big">${cvTag(SID,pi.cover_file_id,ic)}</div><div class="lgw big">${lgTag(SID,pi.logo_file_id,ic)}</div></div><div class="ht"><h2>${esc(s.name_ar)}</h2><small>${esc(s.type_name)}${pi.region_name?' · '+esc(pi.region_name):''}${pi.address?' — '+esc(pi.address):''}</small><p>${badge(s.is_open)}${s.is_open?'':' <small>الأصناف للتصفح فقط</small>'}</p></div>`

  +(!T&&s.is_open&&d.order_enabled?'<div class="card"><small>سجّل الدخول من <a href="/">الصفحة الرئيسية</a> عشان تطلب.</small></div>':'');
}catch(e){m.innerHTML=`<div class="card"><button class="line" onclick="sback()">‹ رجوع</button><p class="e">${esc(e&&e.message?e.message:e)}</p></div>`}}
window.ord=async()=>{if(BUSY||!Object.keys(CART).length)return;BUSY=1;const b=$('ob');if(b)b.disabled=true;
 try{KEY=KEY||(typeof crypto!='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());
 const r=await api('/shops/'+SID+'/order',{request_key:KEY,items:Object.entries(CART).map(([i,x])=>({item_id:+i,qty:x.q})),dropoff_text:$('da').value,note:$('dn').value});
 CART={};KEY='';m.innerHTML=`<div class="card"><b class="okm">تم إرسال طلبك ✓</b><p>رقم الطلب #${esc(r.id)} — رمز التسليم: <b>${esc(r.delivery_code)}</b></p><small>جاري تحويلك لمتابعة طلبك… المندوب هيقترح أجرة التوصيل وانت توافق من <a href="/#orders">طلباتي ← التوصيل</a>.</small></div><button class="line" onclick="sback()">‹ كل المحلات</button>`;setTimeout(()=>{location.href='/#orders'},1200)}  /* م84: تحويل تلقائي لمتابعة الطلب */
 catch(e){msg=esc(e&&e.message?e.message:e);isErr=1;const da=$('da')?$('da').value:'',dn=$('dn')?$('dn').value:'',c=CART;await menu();CART=c;Object.keys(c).forEach(i=>{const q=$('q'+i);if(q)q.textContent=c[i].q});if($('da')){$('da').value=da;$('dn').value=dn;$('ct').textContent=total()+' ج';$('ob').disabled=!Object.keys(c).length}msg='';isErr=0}
